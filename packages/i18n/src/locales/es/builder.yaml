        body: Explore las herramientas que le ayudarán a lanzar más rápido y escalar con confianza.
      featuresBento:
        title: Creado para propietarios de salones
        body: "Administra tu silla, no tu bandeja de entrada: reservas, pagos y recordatorios en un solo lugar."
        tile1Title: Reserva online
        tile1Body: Los clientes eligen un servicio, estilista y horario, incluso fuera de horario.
        tile2Title: recordatorios inteligentes
        tile2Body: Evite las ausencias con SMS y correos electrónicos automáticos antes de cada visita.
        tile3Title: Depósitos y pago
        tile3Body: Asegure el tiempo de silla con depósitos o acepte el pago cuando reserven.
        tile4Title: Ejecútalo desde tu teléfono
        tile4Body: Consulte su día, envíe mensajes a sus clientes y bloquee el tiempo entre citas.
      zigzagFeature:
        image1Alt: Interior del salón
        image2Alt: Estilista trabajando con un cliente
        row1Title: Una primera impresión pulida
        row1Body: Muestre su espacio, servicios y equipo con un hermoso sitio web de reservas que combine con su marca.
        row2Title: Menos administración, más tiempo de presidencia
        row2Body: Automatice confirmaciones, recordatorios y reprogramaciones para que pueda concentrarse en los clientes en la silla.
      featureListWithImage:
        title: Por qué los dueños de salones nos eligen
        list: |-
          • Llene su calendario con reservas en línea 24 horas al día, 7 días a la semana
          • Reduzca las ausencias con recordatorios SMS automáticos
          • Luzca profesional con una experiencia de cliente de marca
          • Reciba pagos por adelantado con depósitos y pagos con tarjeta
        imageAlt: Estación de peluquería moderna
    conversion:
      pricingThreeColumn:
        title: Precios simples y transparentes
        body: Elige el plan que se adapte a tu salón. Actualice en cualquier momento.
      cookieAcknowledgmentBanner:
        message: Utilizamos cookies y tecnologías similares para comprender cómo los visitantes utilizan nuestro sitio web.
        button: Entiendo
        privacyPolicy: Política de privacidad
    content:
      faqSection:
        eyebrow: Preguntas frecuentes
        title: Preguntas frecuentes
        body: Todo lo que necesitas saber para empezar.
        q1: ¿Cómo empiezo?
        a1: Cree una cuenta, elija una plantilla y publique su primera página en minutos.
        q2: ¿Puedo cambiar de plan más tarde?
        a2: Sí. Actualice o baje de categoría en cualquier momento desde la configuración de su cuenta.
        q3: ¿Ofrecen una prueba gratuita?
        a3: Cada plan incluye un período de prueba para que puedas explorar antes de comprometerte.
        q4: ¿Cómo me comunico con el soporte?
        a4: Comuníquese con nuestro equipo por chat o correo electrónico; normalmente respondemos dentro de un día hábil.
      howItWorksSection:
        title: como funciona
        body: Cuatro sencillos pasos para iniciar la página de reservas de tu salón.
        step1Number: "1"
        step1Title: Añade tu salón
        step1Bullets: |-
          • Listar servicios, precios y duración.
          • Sube fotos de tu espacio
          • Establece tu equipo y horarios de trabajo
        step2Number: "2"
        step2Title: Comparte tu enlace de reserva
        step2Bullets: |-
          • Agréguelo a Instagram y Google
          • Colócalo en tu biografía y firma de correo electrónico.
          • Incrustarlo en su sitio web existente
        step3Number: "3"
        step3Title: Los clientes reservan ellos mismos
        step3Bullets: |-
          • Eligen un servicio y franja horaria
          • Las confirmaciones salen automáticamente
          • Recibes una notificación al instante
        step4Number: "4"
        step4Title: Aparece y haz lo que amas
        step4Bullets: |-
          • Los recordatorios reducen las ausencias
          • Los depósitos protegen su agenda
          • El historial del cliente permanece en un solo lugar
      comparisonTableSection:
        title: Comparar planes
        body: Vea cómo nuestros niveles se comparan uno al lado del otro.
      beforeAfterSection:
        title: ver la diferencia
        body: Arrastre el control deslizante para comparar los resultados del antes y el después.
        beforeAlt: Antes del tratamiento
        afterAlt: Después del tratamiento
    media:
      browserCarouselSection:
        eyebrow: Recorrido por el software del salón
