    salon:
      home:
        heroTitle: "Cabello, uñas y brillo: reservado en minutos"
        heroSubtitle: Con la confianza de los lugareños que desean excelentes resultados sin la etiqueta del teléfono. Busque servicios y reserve un horario en Bench Salon.
        bookCta: Reserva ahora
        announcement: "Bienvenidos nuevos clientes: vacantes disponibles la misma semana"
        servicesTitle: Servicios creados a tu alrededor
        servicesBody: "Cada reserva incluye un espacio exclusivo: sin doble reserva ni prisas."
        galleryTitle: Galería
        lookInsideTitle: mira adentro
        testimonialsTitle: Lo que dicen los clientes
        howTitle: como funciona
        howBody: Tres sencillos pasos desde navegar hasta salir feliz.
        faqTitle: Preguntas frecuentes
        faqBody: Respuestas rápidas antes de reservar.
        faqQ1: ¿Cómo reservo?
        faqA1: Utilice la página Reservar para elegir un servicio y el horario disponible. Recibirá un correo electrónico de confirmación de inmediato.
        faqQ2: ¿Cuál es su política de cancelación?
        faqA2: Cancele o reprograme con al menos 24 horas de anticipación para que podamos ofrecer el espacio a otra persona.
        faqQ3: ¿Aceptas visitas sin cita previa?
        faqA3: Priorizamos las citas reservadas. Las vacantes para el mismo día a veces aparecen en línea; consulte la página Reservar.
        faqQ4: ¿Dónde te encuentras?
        faqA4: "Bench Salon es fácil de encontrar: las direcciones están incluidas en su confirmación."
        pricingTitle: Paquetes simples
        comparisonTitle: ¿Por qué reservar con nosotros?
        ctaTitle: Listo cuando lo estés
        ctaBody: "Elija un horario que funcione: la confirmación llega a su bandeja de entrada en segundos."
      booking:
        title: Elija un horario que funcione
        body: Seleccione un servicio, elija una vacante y obtenga confirmación instantánea. Reprograme desde su enlace de correo electrónico cuando cambien los planes.
      service:
        bullet1: "Duración de la cita dedicada: sin clientes superpuestos"
        bullet2: Confirmación y recordatorios por correo electrónico.
        bullet3: Reprogramación sencilla desde el enlace de su reserva
      about:
        title: La historia detrás de Bench Salon
        body1: "Creamos Bench Salon para facilitar la reserva de un excelente servicio: precios transparentes, disponibilidad real y personas que se preocupan por los detalles."
        body2: "Cabello, uñas y brillo: reservado en minutos. Ya sea su primera visita o la quincuagésima, debería salir sintiéndose atendido."
      terms:
        title: Políticas de reserva
        intro: Estos marcadores de posición son sólo para revisión y no constituyen asesoramiento legal. Reemplácelo con términos aprobados por el abogado antes de publicar.
        appointmentsTitle: Equipo
        appointmentsBody: Al reservar con Bench Salon, acepta llegar a tiempo y proporcionar datos de contacto precisos. Las llegadas tardías pueden acortar su servicio.
        cancelTitle: Cancelaciones y reprogramaciones
        cancelBody: Cancele o reprograme al menos 24 horas antes de su cita. Las no presentaciones repetidas pueden requerir un depósito para futuras reservas.
        paymentsTitle: Pagos y reembolsos
        paymentsBody: Las tarifas por los servicios completados no son reembolsables. Los depósitos, cuando sean necesarios, se aplican a su visita o se pierden según el período de cancelación.
        liabilityTitle: Responsabilidad
        liabilityBody: En la máxima medida permitida por la ley, Bench Salon no es responsable de los daños indirectos o incidentales que surjan del uso de nuestro sitio o servicios de reserva, excepto donde esté prohibido.
        contactTitle: Contacto
        contactBody: ¿Preguntas sobre estas políticas? Comuníquese a través de los datos de contacto en su correo electrónico de confirmación.
      services:
        cut:
          name: Corte y estilo exclusivos.
          description: Consulta, corte de precisión y acabado con secador adaptado a la forma de tu rostro.
        color:
          name: Actualización de color
          description: Color o brillo en un solo proceso para reavivar el brillo y cubrir las raíces.
        nails:
          name: Manicura en gel
          description: Esmalte en gel de larga duración con cuidado de cutículas y sellado brillante.
        blowout:
          name: Explosión exprés
          description: "Lavar, peinar y configurar: listo para una cena o una sesión de fotos."
