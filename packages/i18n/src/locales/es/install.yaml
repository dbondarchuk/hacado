              description: "**Tratamiento con cera tibia** para manos y cutículas más suaves antes del pulido."
            basic_manicure-addon-nails-2:
              name: Acento del arte de las uñas
              description: "**Diseño simple o puntas francesas** en dos uñas decorativas."
