        bullet3: Просте перенесення за посиланням для бронювання
      about:
        title: Історія Bench Salon
        body1: Ми створили Bench Salon, щоб зробити чудові послуги легкими для бронювання - прозорі ціни, реальна доступність і люди, які піклуються про деталі.
        body2: Волосся, нігті та блиск - бронюйте за лічені хвилини. Незалежно від того, чи це ваш перший візит, чи ваш п’ятдесятий, ви повинні залишити відчути турботу.
      terms:
        title: Політика бронювання
        intro: Ці заповнювачі призначені лише для перегляду і не є юридичною порадою. Перед публікацією замініть умовами, схваленими консультантом.
        appointmentsTitle: Призначення
        appointmentsBody: Здійснюючи бронювання в Bench Salon, ви погоджуєтесь прибути вчасно та надаєте точні контактні дані. Пізнє прибуття може скоротити час обслуговування.
        cancelTitle: Скасування та перенесення
        cancelBody: Будь ласка, скасуйте або перенесіть принаймні за 24 години до зустрічі. У разі повторної неявки може знадобитися депозит для майбутніх бронювань.
        paymentsTitle: Платежі та відшкодування
        paymentsBody: Плата за виконані послуги не повертається. Депозити, якщо потрібно, застосовуються під час вашого візиту або втрачаються після вікна скасування.
        liabilityTitle: Відповідальність
        liabilityBody: У повній мірі, дозволеній законодавством, Bench Salon не несе відповідальності за непрямі чи випадкові збитки, спричинені використанням нашого сайту бронювання або послуг, за винятком випадків, коли це заборонено.
        contactTitle: контакт
        contactBody: Запитання щодо цих політик? Зв’яжіться з нами за допомогою контактних даних у вашому електронному листі з підтвердженням.
