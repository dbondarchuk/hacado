        faqTitle: FAQ
        faqBody: Швидкі відповіді перед бронюванням.
        faqQ1: Як забронювати?
        faqA1: Використовуйте сторінку «Забронювати», щоб вибрати послугу та доступний час. Ви одразу отримаєте електронний лист із підтвердженням.
        faqQ2: Яка ваша політика скасування?
        faqA2: Скасуйте або перенесіть принаймні на 24 години, щоб ми могли запропонувати слот комусь іншому.
        faqQ3: Ви приймаєте прогулянки?
        faqA3: Ми надаємо пріоритет записаним зустрічам. Відкриття в той же день іноді з’являються в Інтернеті - перевірте сторінку Книги.
        faqQ4: Де ти знаходишся?
        faqA4: Bench Salon легко знайти - інструкції включені у ваше підтвердження.
        pricingTitle: Прості пакети
        comparisonTitle: Чому варто бронювати у нас
        ctaTitle: Готовий, коли будеш
        ctaBody: Виберіть зручний для вас час - підтвердження надходить у вашу поштову скриньку за лічені секунди.
      booking:
        title: Виберіть зручний час
        body: Виберіть послугу, виберіть вакансію та отримайте миттєве підтвердження. Перенесіть за посиланням електронної пошти, коли плани зміняться.
