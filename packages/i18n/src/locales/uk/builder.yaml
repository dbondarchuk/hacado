    salon:
      home:
        heroTitle: Волосся, нігті та блиск - бронюйте за лічені хвилини
        heroSubtitle: Нам довіряють місцеві жителі, які хочуть чудових результатів без телефонної мітки. Перегляньте послуги та зафіксуйте час у Bench Salon.
        bookCta: Забронюйте зараз
        announcement: Ласкаво просимо нових клієнтів - доступні відкриття на той самий тиждень
        servicesTitle: Сервіси, створені навколо вас
        servicesBody: Кожне бронювання включає окремий слот - без подвійного бронювання та поспіху.
        galleryTitle: Галерея
        lookInsideTitle: Загляніть всередину
        testimonialsTitle: Що кажуть клієнти
        howTitle: Як це працює
        howBody: Три прості кроки від перегляду до виходу щасливого.
        faqTitle: FAQ
        faqBody: Швидкі відповіді перед бронюванням.
        faqQ1: Як забронювати?
        faqA1: Використовуйте сторінку «Забронювати», щоб вибрати послугу та доступний час. Ви одразу отримаєте електронний лист із підтвердженням.
        faqQ2: Яка ваша політика скасування?
        faqA2: Скасуйте або перенесіть принаймні на 24 години, щоб ми могли запропонувати слот комусь іншому.
        faqQ3: Ви приймаєте без запису?
        faqA3: Ми надаємо пріоритет записаним зустрічам. Записи в той же день іноді з’являються в Інтернеті - перевірте сторінку Книги.
        faqQ4: Де ви знаходитесь?
        faqA4: Bench Salon легко знайти - інструкції включені у ваше підтвердження.
        pricingTitle: Прості пакети
        comparisonTitle: Чому варто бронювати у нас
        ctaTitle: Готові, коли і Ви
        ctaBody: Виберіть зручний для вас час - підтвердження надходить у вашу поштову скриньку за лічені секунди.
      booking:
        title: Виберіть зручний час
        body: Виберіть послугу, виберіть вакансію та отримайте миттєве підтвердження. Перенесіть за посиланням електронної пошти, коли плани зміняться.
      service:
        bullet1: Виділена тривалість зустрічей - без накладання клієнтів
        bullet2: Підтвердження та нагадування електронною поштою
        bullet3: Просте перенесення за посиланням для бронювання
      about:
        title: Історія Bench Salon
        body1: Ми створили Bench Salon, щоб зробити чудові послуги легкими для бронювання - прозорі ціни, реальна доступність і люди, які піклуються про деталі.
        body2: Волосся, нігті та блиск - бронюйте за лічені хвилини. Незалежно від того, чи це ваш перший візит, чи ваш п’ятдесятий, ви повинні залишити відчути турботу.
      terms:
        title: Політика бронювання
        intro: Ці заповнювачі призначені лише для перегляду і не є юридичною порадою. Перед публікацією замініть умовами, схваленими консультантом.
        appointmentsTitle: Записи
        appointmentsBody: Здійснюючи бронювання в Bench Salon, ви погоджуєтесь прибути вчасно та надаєте точні контактні дані. Пізнє прибуття може скоротити час обслуговування.
        cancelTitle: Скасування та перенесення
        cancelBody: Будь ласка, скасуйте або перенесіть принаймні за 24 години до зустрічі. У разі повторної неявки може знадобитися депозит для майбутніх бронювань.
        paymentsTitle: Платежі та відшкодування
        paymentsBody: Плата за виконані послуги не повертається. Депозити, якщо потрібно, застосовуються під час вашого візиту або втрачаються після вікна скасування.
        liabilityTitle: Відповідальність
        liabilityBody: У повній мірі, дозволеній законодавством, Bench Salon не несе відповідальності за непрямі чи випадкові збитки, спричинені використанням нашого сайту бронювання або послуг, за винятком випадків, коли це заборонено.
        contactTitle: контакт
        contactBody: Запитання щодо цих політик? Зв’яжіться з нами за допомогою контактних даних у вашому електронному листі з підтвердженням.
      services:
        cut:
          name: Фірмовий крій і стиль
          description: Консультація, точна стрижка та сушіння феном відповідно до вашої форми обличчя.
        color:
          name: Оновлення кольору
          description: Одноразова фарба або блиск для відновлення блиску та покриття коренів.
        nails:
          name: Гелевий манікюр
          description: Довготривалий гель-лак з доглядом за кутикулою та глянцевою печаткою.
        blowout:
          name: Експрес Blowout
          description: Виперіть, укладіть і налаштуйте - готово до вечері чи фотосесії.
