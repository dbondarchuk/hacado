      purchaseButton: Купити SMS-кредити
      handledBy: Білінг (залишок SMS)
    smsCreditsExhausted:
      subject: Кредити SMS вичерпано
      preview: Кредити SMS закінчились
      title: Кредити SMS вичерпано
      body: "Залишок SMS: 0. Якщо ви хочете надсилати більше повідомлень, купіть більше кредитів у налаштуваннях білінгу."
      button: Відкрити білінг
      purchaseButton: Купити SMS-кредити
      handledBy: Білінг (залишок SMS)
    appointmentLimitReached:
      subject: Ліміт записів на Free вичерпано
      preview: Ви використали всі записи за цей білінговий цикл
      title: Ліміт записів за цикл досягнуто
      body: Ви використали всі {limit} записів, включених у тариф Free за цей білінговий цикл. Нові бронювання заблоковані до початку наступного циклу. Перейдіть на Solo для необмежених записів.
      button: Перейти на Solo
      handledBy: Білінг (ліміт записів)
  notifications:
    smsCreditsLow:
      title: Мало SMS-кредитів
      message: Залишок SMS зараз {balance}. Поповніть кредити, щоб уникнути перебоїв у доставці.
