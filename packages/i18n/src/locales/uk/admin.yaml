      handledBy: Білінг (підписка)
    smsCreditsLow:
      subject: Мало кредитів SMS
      preview: Залишилось 10 кредитів SMS
      title: Низький залишок SMS-кредитів
      body: "Залишок SMS: {balance} кредитів. Якщо ви хочете надсилати більше повідомлень, купіть більше кредитів у налаштуваннях білінгу."
