        title: Aimé par les propriétaires de salon
        body: Écoutez les témoignages de stylistes et de propriétaires de spa qui sont passés à la réservation en ligne.
      logoCloudGrid:
        title: Salons propulsés par Hacado
        body: Les entreprises de beauté indépendantes se développent avec notre plateforme.
    features:
      featuresShowcase:
        eyebrow: Caractéristiques
        title: Tout ce dont vous avez besoin pour grandir
        body: Découvrez les outils qui vous aident à lancer plus rapidement et à évoluer en toute confiance.
      featuresBento:
        title: Conçu pour les propriétaires de salon
        body: "Gérez votre chaise, pas votre boîte de réception : réservations, paiements et rappels au même endroit."
        tile1Title: Réservation en ligne
        tile1Body: Les clients choisissent un service, un styliste et une heure, même en dehors des heures d'ouverture.
        tile2Title: Rappels intelligents
        tile2Body: Évitez les non-présentations grâce aux SMS et e-mails automatiques avant chaque visite.
        tile3Title: Dépôts et paiement
        tile3Body: Sécurisez le temps de chaise avec des dépôts ou acceptez le paiement lors de la réservation.
        tile4Title: Exécutez-le depuis votre téléphone
        tile4Body: Vérifiez votre journée, envoyez des messages aux clients et bloquez le temps entre les rendez-vous.
      zigzagFeature:
        image1Alt: Intérieur du salon
        image2Alt: Styliste travaillant avec un client
        row1Title: Une première impression soignée
        row1Body: Présentez votre espace, vos services et votre équipe avec un magnifique site de réservation qui correspond à votre marque.
        row2Title: Moins d'administration, plus de temps de présidence
        row2Body: Automatisez les confirmations, les rappels et les reprogrammations afin de pouvoir vous concentrer sur les clients assis au fauteuil.
      featureListWithImage:
        title: Pourquoi les propriétaires de salon nous choisissent
        list: |-
          • Remplissez votre calendrier avec une réservation en ligne 24h/24 et 7j/7
          • Réduisez les absences grâce aux rappels SMS automatisés
          • Ayez l'air professionnel avec une expérience client de marque
          • Soyez payé d'avance avec les dépôts et les paiements par carte
        imageAlt: Station de coiffure de salon moderne
    conversion:
      pricingThreeColumn:
        title: Une tarification simple et transparente
        body: Choisissez le plan qui correspond à votre salon. Mettez à niveau à tout moment.
      cookieAcknowledgmentBanner:
        message: Nous utilisons des cookies et des technologies similaires pour comprendre comment les visiteurs utilisent notre site Web.
        button: J'ai compris
        privacyPolicy: Politique de confidentialité
    content:
      faqSection:
        eyebrow: FAQ
        title: Questions fréquemment posées
        body: Tout ce que vous devez savoir pour commencer.
        q1: Comment puis-je commencer ?
        a1: Créez un compte, choisissez un modèle et publiez votre première page en quelques minutes.
        q2: Puis-je modifier mes plans plus tard ?
        a2: Oui. Mettez à niveau ou rétrogradez à tout moment à partir des paramètres de votre compte.
        q3: Proposez-vous un essai gratuit ?
        a3: Chaque plan comprend une période d'essai afin que vous puissiez explorer avant de vous engager.
        q4: Comment contacter l'assistance ?
        a4: Contactez notre équipe par chat ou par e-mail. Nous répondons généralement dans un délai d'un jour ouvrable.
      howItWorksSection:
        title: Comment ça marche
        body: Quatre étapes simples pour lancer votre page de réservation de salon.
        step1Number: "1"
        step1Title: Ajoutez votre salon
        step1Bullets: |-
          • Liste des services, des prix et de la durée
          • Téléchargez des photos de votre espace
          • Définissez votre équipe et vos horaires de travail
        step2Number: "2"
        step2Title: Partagez votre lien de réservation
        step2Bullets: |-
          • Ajoutez-le à Instagram et Google
          • Déposez-le dans votre biographie et votre signature électronique
          • Intégrez-le sur votre site Web existant
        step3Number: "3"
        step3Title: Les clients réservent eux-mêmes
        step3Bullets: |-
          • Ils choisissent un service et un créneau horaire
          • Les confirmations sont envoyées automatiquement
          • Vous êtes averti instantanément
        step4Number: "4"
        step4Title: Présentez-vous et faites ce que vous aimez
        step4Bullets: |-
          • Les rappels réduisent les non-présentations
          • Les dépôts protègent votre emploi du temps
          • L'historique des clients reste au même endroit
      comparisonTableSection:
        title: Comparez les forfaits
        body: Découvrez comment nos niveaux se comparent côte à côte.
      beforeAfterSection:
        title: Voyez la différence
        body: Faites glisser le curseur pour comparer les résultats avant et après.
        beforeAlt: Avant le traitement
        afterAlt: Après le traitement
    media:
      browserCarouselSection:
        eyebrow: Visite guidée du logiciel du salon
        title: Consultez votre flux de réservation
        body: Un aperçu des outils que vos clients et votre équipe utilisent quotidiennement.
        slide1Label: Page de réservation de marque
        slide1Address: glowstudio.hacado.me/book
        slide2Label: Calendrier des salons
        slide2Address: app.hacado.com/calendar
        slide3Label: Rappels clients
        slide3Address: app.hacado.com/rappels
      videoEmbedSection:
        title: Regardez comment les salons utilisent Hacado
        body: Une présentation rapide de la réservation en ligne pour votre salon.
      galleryGrid:
        title: À l'intérieur du salon
        body: Espaces, services et résultats des salons sur Hacado.
        imageAlt: Photo du salon
      galleryMasonry:
        title: Lookbook
        body: "Colonnes de photos décalées : appuyez sur n'importe quelle photo pour l'ouvrir."
        imageAlt: Galerie de photos
