    salon:
      home:
        heroTitle: Cheveux, ongles et éclat - réservés en quelques minutes
        heroSubtitle: Approuvé par les locaux qui veulent d'excellents résultats sans étiquette téléphonique. Parcourez les services et réservez un moment chez Bench Salon.
        bookCta: Réservez maintenant
        announcement: Nouveaux clients bienvenus - ouvertures disponibles la même semaine
        servicesTitle: Des services construits autour de vous
        servicesBody: Chaque réservation comprend un créneau dédié - pas de double réservation, pas de précipitation.
        galleryTitle: Galerie
        lookInsideTitle: Regardez à l'intérieur
        testimonialsTitle: Ce que disent les clients
        howTitle: Comment ça marche
        howBody: Trois étapes simples entre la navigation et la sortie heureuse.
        faqTitle: FAQ
        faqBody: Réponses rapides avant de réserver.
        faqQ1: Comment réserver ?
        faqA1: Utilisez la page Réserver pour choisir un service et l’heure disponible. Vous recevrez immédiatement un e-mail de confirmation.
        faqQ2: Quelle est votre politique d’annulation ?
        faqA2: Veuillez annuler ou reprogrammer au moins 24 heures à l'avance afin que nous puissions proposer le créneau à quelqu'un d'autre.
        faqQ3: Acceptez-vous des visites sans rendez-vous ?
        faqA3: Nous priorisons les rendez-vous réservés. Les ouvertures le jour même apparaissent parfois en ligne – consultez la page Réserver.
        faqQ4: Où es-tu situé?
        faqA4: Bench Salon est facile à trouver - les directions sont incluses dans votre confirmation.
        pricingTitle: Forfaits simples
        comparisonTitle: Pourquoi réserver avec nous
        ctaTitle: Prêt quand tu l'es
        ctaBody: "Choisissez une heure qui vous convient : la confirmation arrive dans votre boîte de réception en quelques secondes."
      booking:
        title: Choisissez une heure qui fonctionne
        body: Sélectionnez un service, choisissez une ouverture et obtenez une confirmation instantanée. Reprogrammez à partir de votre lien e-mail lorsque les plans changent.
      service:
        bullet1: Durée de rendez-vous dédiée - pas de clients qui se chevauchent
        bullet2: Confirmation et rappels par email
        bullet3: Reprogrammation facile à partir de votre lien de réservation
      about:
        title: L’histoire derrière Bench Salon
        body1: "Nous avons créé Bench Salon pour faciliter la réservation d'un excellent service : des prix transparents, une disponibilité réelle et des personnes soucieuses des détails."
        body2: Cheveux, ongles et éclat - réservés en quelques minutes. Que ce soit votre première visite ou votre cinquantième, vous devriez repartir en vous sentant pris en charge.
      terms:
        title: Politiques de réservation
        intro: Ces espaces réservés sont uniquement destinés à un examen et ne constituent pas des conseils juridiques. Remplacez par des conditions approuvées par l’avocat avant de publier.
        appointmentsTitle: Rendez-vous
        appointmentsBody: En réservant auprès de Bench Salon, vous vous engagez à arriver à l’heure et à fournir des coordonnées précises. Les arrivées tardives peuvent raccourcir votre service.
        cancelTitle: Annulations et report
        cancelBody: Veuillez annuler ou reporter au moins 24 heures avant votre rendez-vous. Les non-présentations répétées peuvent nécessiter un dépôt pour les réservations futures.
        paymentsTitle: Paiements et remboursements
        paymentsBody: Les frais pour les services complétés ne sont pas remboursables. Les dépôts, lorsqu'ils sont requis, sont appliqués à votre visite ou perdus selon la fenêtre d'annulation.
        liabilityTitle: Responsabilité
        liabilityBody: Dans toute la mesure permise par la loi, Bench Salon n'est pas responsable des dommages indirects ou accessoires résultant de l'utilisation de notre site de réservation ou de nos services, sauf là où cela est interdit.
        contactTitle: Contact
        contactBody: Des questions sur ces politiques ? Contactez-nous via les coordonnées figurant dans votre e-mail de confirmation.
      services:
        cut:
          name: Coupe et style signature
          description: Consultation, coupe de précision et finition brushing adaptées à la forme de votre visage.
        color:
          name: Actualisation des couleurs
          description: Couleur ou brillant en un seul procédé pour raviver la brillance et couvrir les racines.
        nails:
          name: Manucure Gel
          description: Vernis gel longue tenue avec soin des cuticules et joint brillant.
        blowout:
          name: Éruption express
          description: Lavez, coiffez et préparez – prêt pour le dîner ou une séance photo.
