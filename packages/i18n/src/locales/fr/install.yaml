          name: Coupe de cheveux et style pour femmes
          description: "**Une coupe de cheveux personnalisée** adaptée à votre style et à la forme de votre visage. Comprend un lavage, une coupe de précision et une éruption pour un look fini."
          addons:
            women_s_haircut_style-addon-beauty-1:
              name: Rafraîchissement du gloss tonifiant
              description: "**Gloss semi-permanent** pour raviver la brillance et le tonus entre les visites complètes."
            women_s_haircut_style-addon-hair-2:
              name: Masque revitalisant en profondeur
              description: "**Traitement hydratant intensif** après votre coupe pour des cheveux plus doux et plus lisses."
        men_s_haircut:
          name: Coupe de cheveux pour hommes
          description: "**Une coupe de cheveux nette et précise** incluant consultation et coiffage. Parfait pour un entretien régulier et des looks mis à jour."
          addons:
            men_s_haircut-addon-beauty-1:
              name: Taille et alignement de la barbe
              description: "**Bords propres et mise en forme de la barbe** pour que votre coupe de cheveux et votre barbe correspondent."
        full_color:
          name: Pleine couleur
          description: "**Application complète de la couleur** avec consultation et finition professionnelle. Idéal pour les colorations complètes ou les transformations majeures."
          addons:
            full_color-addon-beauty-1:
              name: Traitement de renforcement des liens
              description: "**Étape de renforcement** pour aider à protéger les cheveux pendant le traitement chimique."
            full_color-addon-hair-2:
              name: Module complémentaire d'actualisation de la racine
              description: "**Petite retouche racinaire ciblée** lorsqu'elle est réservée avec une couleur (portée limitée)."
    nail_technician:
      label: Technicienne en ongles
      services:
        basic_manicure:
          name: Manucure de base
          description: "**Mise en forme et soin des ongles**, y compris le traitement et le vernis des cuticules. Un service de maintenance rapide et rafraîchissant."
          addons:
            basic_manicure-addon-beauty-1:
              name: Trempage de cire de paraffine
              description: "**Traitement à la cire chaude** pour des mains et des cuticules plus douces avant le polissage."
            basic_manicure-addon-nails-2:
              name: Accents de nail art
              description: "**Conception simple ou astuces françaises** sur deux ongles accentués."
        gel_manicure:
          name: Manucure Gel
          description: "**Application de vernis gel durable** avec durcissement professionnel. Comprend une préparation des ongles et une finition longue durée."
          addons:
            gel_manicure-addon-beauty-1:
              name: Élimination du gel
              description: "**Trempage en toute sécurité** lors du retrait du gel existant avant une nouvelle série."
            gel_manicure-addon-nails-2:
              name: Massage prolongé des mains
              description: "**Durée de massage supplémentaire** au-delà du service de gel standard."
        acrylic_full_set:
          name: Ensemble complet en acrylique
          description: "**Amélioration des ongles en acrylique** avec mise en forme et vernis personnalisés. Idéal pour les clients souhaitant une longueur ou un design supplémentaire."
          addons:
            acrylic_full_set-addon-beauty-1:
