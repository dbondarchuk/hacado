app:
  displayName: My Cabinet
  description: |-
    **My Cabinet** lets returning clients sign in with a short code to view and manage their appointments.

    Once installed, the cabinet is available on your website at **`/my-cabinet`**. Brand the page with your site header and footer from the app settings.

    Use it to:
    - Let clients review upcoming and past appointments.
    - Allow self-service booking, cancel, and reschedule when your settings allow.
    - Offer waitlist actions automatically when the Waitlist app is installed.
statusText:
  successfully_set_up: Successfully set up My Cabinet
  error_processing_configuration: Error processing My Cabinet configuration
form:
  connect: Connect <app></app>
  update: Update <app></app>
  publicPageDisabled:
    label: Disable public page at /my-cabinet
    description: When enabled, the app does not claim /my-cabinet. Use a CMS page with the My Cabinet block instead. Header and footer below apply only when the public page is active.
  headerId:
    label: Page header
    description: Optional header shown on the public My Cabinet page at /my-cabinet
    placeholder: Select header
  footerId:
    label: Page footer
    description: Optional footer shown on the public My Cabinet page at /my-cabinet
    placeholder: Select footer
block:
  displayName: My Cabinet
  category: Booking
  showTitle:
    label: Show title
  scrollToTop:
    label: Scroll to top on step change
  myCabinetAppId:
    label: My Cabinet app
    helperText: Select which My Cabinet app instance this block should use.
  waitlistAppId:
    label: Waitlist app
    helperText: Optional. Enables joining the waitlist from in-cabinet booking.
