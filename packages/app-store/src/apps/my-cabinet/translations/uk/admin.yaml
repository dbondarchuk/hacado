app:
  displayName: Мій кабінет
  description: |-
    **Мій кабінет** дає постійним клієнтам увійти за коротким кодом, щоб переглядати та керувати своїми записами.

    Після встановлення кабінет доступний на вашому сайті за адресою **`/my-cabinet`**. Оформлення сторінки (шапка та підвал) налаштовується в параметрах додатка.

    Використовуйте, щоб:
    - Дати клієнтам переглядати майбутні та минулі записи.
    - Дозволити самостійне бронювання, скасування та перенесення, якщо це увімкнено в налаштуваннях.
    - Автоматично пропонувати дії черги, коли встановлено додаток Waitlist.
statusText:
  successfully_set_up: Мій кабінет успішно налаштовано
  error_processing_configuration: Помилка обробки налаштувань Мого кабінету
form:
  connect: Підключити <app></app>
  update: Оновити <app></app>
  publicPageDisabled:
    label: Вимкнути публічну сторінку /my-cabinet
    description: Якщо увімкнено, додаток не займає /my-cabinet. Використовуйте CMS-сторінку з блоком Мій кабінет. Шапка та підвал нижче застосовуються лише коли публічна сторінка активна.
  headerId:
    label: Шапка сторінки
    description: Необовʼязкова шапка на публічній сторінці Мого кабінету за адресою /my-cabinet
    placeholder: Оберіть шапку
  footerId:
    label: Підвал сторінки
    description: Необовʼязковий підвал на публічній сторінці Мого кабінету за адресою /my-cabinet
    placeholder: Оберіть підвал
block:
  displayName: Мій кабінет
  category: Бронювання
  showTitle:
    label: Показувати заголовок
