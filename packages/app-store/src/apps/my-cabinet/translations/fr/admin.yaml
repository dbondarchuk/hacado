app:
  displayName: Mon Cabinet
  description: |-
    **Mon Cabinet** permet aux clients fidèles de se connecter avec un code court pour afficher et gérer leurs rendez-vous.

    Une fois installé, le cabinet est disponible sur votre site Web à l'adresse **`/my-cabinet`**. Marquez la page avec l'en-tête et le pied de page de votre site à partir des paramètres de l'application.

    Utilisez-le pour :
    - Laissez les clients consulter les rendez-vous à venir et passés.
    - Autorisez la réservation en libre-service, l'annulation et la reprogrammation lorsque vos paramètres le permettent.
    - Proposez automatiquement des actions sur la liste d'attente lorsque l'application Waitlist est installée.
statusText:
  successfully_set_up: Configuration réussie de Mon Cabinet
  error_processing_configuration: Erreur lors du traitement de la configuration de Mon armoire
form:
