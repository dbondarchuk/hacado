app:
  displayName: mi gabinete
  description: |-
    **My Cabinet** permite a los clientes que regresan iniciar sesión con un código corto para ver y administrar sus citas.

    Una vez instalado, el gabinete está disponible en su sitio web en **`/my-cabinet`**. Marca la página con el encabezado y pie de página de tu sitio desde la configuración de la aplicación.

    Úselo para:
    - Permitir que los clientes revisen las citas pasadas y futuras.
    - Permitir reserva, cancelación y reprogramación de autoservicio cuando su configuración lo permita.
    - Ofrezca acciones de lista de espera automáticamente cuando se instale la aplicación Lista de espera.
statusText:
  successfully_set_up: Configurar exitosamente Mi Gabinete
  error_processing_configuration: Error al procesar la configuración de Mi Gabinete
form:
