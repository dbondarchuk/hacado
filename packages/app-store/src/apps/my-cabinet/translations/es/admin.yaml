    description: Cuando está habilitada, la aplicación reclama /my-cabinet. Desactívela para usar una página CMS con el bloque Mi gabinete.
  headerId:
    label: Encabezado de página
    description: Encabezado opcional que se muestra en la página pública Mi gabinete en /my-cabinet
    placeholder: Seleccionar encabezado
  footerId:
