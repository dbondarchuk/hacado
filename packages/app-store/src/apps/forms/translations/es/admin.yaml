      unique: Los campos del formulario deben tener nombres y etiquetas únicos
    notifications:
      email:
        invalid: Debe ser una dirección de correo electrónico válida.
    name:
      min: El nombre del formulario es obligatorio.
      max: El nombre del formulario no debe tener más de 64 caracteres.
      unique: El nombre del formulario debe ser único
