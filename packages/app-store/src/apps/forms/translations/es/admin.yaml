      description:
        min: La descripción debe tener al menos 10 caracteres.
        max: La descripción no debe tener más de 256 caracteres.
      type:
        invalid: El tipo de campo es obligatorio
      options:
        value:
          min: La opción debe tener al menos 2 caracteres.
          max: La opción no debe tener más de 256 caracteres.
        min: Se requieren al menos 2 opciones
        max: Se permiten un máximo de 32 opciones.
        unique: Las opciones deben ser únicas
      text:
        minLength:
          invalid: La longitud mínima debe ser un número entero positivo.
        maxLength:
          invalid: La longitud máxima debe ser un número entero positivo.
        minMaxRange:
          invalid: La longitud mínima no debe ser mayor que el valor de longitud máxima
      oneLine:
        maxLength:
          max: La longitud máxima no debe ser superior a 256 caracteres.
      multiLine:
        maxLength:
          max: La longitud máxima no debe ser superior a 4096 caracteres.
      multiSelect:
        minSelected:
          invalid: Debe ser un número entero positivo
        maxSelected:
          invalid: Debe ser un número entero positivo
          min: Debe ser al menos 1
        minMaxRange:
          invalid: El mínimo seleccionado no debe ser mayor que el valor máximo seleccionado
      file:
        accept:
          invalid: Debe ser un tipo MIME válido
          unique: Los tipos de archivos deben ser únicos
        maxSizeMb:
          min: El tamaño máximo del archivo debe ser de al menos 1 MB.
          max: El tamaño máximo del archivo no debe ser superior a 100 MB.
