app:
  displayName: Notificación por correo electrónico del cliente
  description: Envíe correos electrónicos personalizados a los clientes sobre sus citas, incluidas confirmaciones, actualizaciones y cancelaciones, para que se mantengan informados en cada paso del camino.
navigation:
  title: Notificación por correo electrónico del cliente
new: Notificación por correo electrónico de nuevo cliente
edit: Editar notificación por correo electrónico del cliente
newDescription: Crear notificación por correo electrónico de nuevo cliente
editDescription: Actualizar la notificación por correo electrónico del cliente
form:
  pending:
    enabled:
      label: Enviar correo cuando una cita está pendiente
      description: Se envía cuando un cliente solicita una cita y esta espera confirmación.
    templateId:
      label: Plantilla de correo
      description: Correo que reciben los clientes cuando una cita está pendiente.
      required: Seleccione una plantilla de correo
  confirmed:
    enabled:
      label: Enviar correo cuando una cita se confirma
      description: Se envía cuando una cita se confirma.
    templateId:
      label: Plantilla de correo
      description: Correo que reciben los clientes cuando una cita se confirma.
      required: Seleccione una plantilla de correo
  pendingPackage:
    enabled:
      label: Enviar un correo distinto para citas de paquete pendientes
      description: Se usa en lugar del correo pendiente cuando la cita está cubierta por un paquete.
    templateId:
      label: Plantilla de correo
      description: Correo que reciben los clientes por una cita de paquete pendiente.
      required: Seleccione una plantilla de correo
  confirmedPackage:
    enabled:
      label: Enviar un correo distinto para citas de paquete confirmadas
      description: Se usa en lugar del correo confirmado cuando la cita está cubierta por un paquete.
    templateId:
      label: Plantilla de correo
      description: Correo que reciben los clientes por una cita de paquete confirmada.
      required: Seleccione una plantilla de correo
  declined:
    enabled:
      label: Enviar correo cuando se rechaza una cita
      description: Se envía cuando rechaza una solicitud de reserva.
    templateId:
      label: Plantilla de correo
      description: Correo que reciben los clientes cuando se rechaza una solicitud.
      required: Seleccione una plantilla de correo
  canceled:
    enabled:
      label: Enviar correo cuando se cancela una cita
      description: Se envía cuando el cliente cancela, o cuando registra la cita como cancelada por el cliente.
    templateId:
      label: Plantilla de correo
      description: Correo que reciben los clientes cuando se cancela una cita.
      required: Seleccione una plantilla de correo
  noShow:
    enabled:
      label: Enviar correo cuando el cliente no se presenta
      description: Se envía cuando marca al cliente como no presentado. Aún puede omitirlo en una cita concreta.
    templateId:
      label: Plantilla de correo
      description: Correo que reciben los clientes cuando se les marca como no presentados.
      required: Seleccione una plantilla de correo
  rescheduled:
    enabled:
      label: Enviar correo cuando se reprograma una cita
      description: Se envía cuando se reprograma una cita.
    templateId:
      label: Plantilla de correo
      description: Correo que reciben los clientes cuando se reprograma una cita.
      required: Seleccione una plantilla de correo
  calendarEventTemplate:
    enabled:
      label: Incluir un evento de calendario
      description: Se añade al correo para que los clientes puedan guardar la cita en su calendario.
    templateId:
      label: Plantilla del evento de calendario
      description: Evento que los clientes ven en su calendario.
      required: Seleccione una plantilla de evento de calendario
statusText:
  email_app_not_configured: El remitente de correo electrónico predeterminado no está configurado
  successfully_set_up: Configurado exitosamente
  error_processing_configuration: Configuración de procesamiento de errores
  error_sending_customer_email_notification_for_new_appointment: Error al enviar una notificación por correo electrónico al cliente para una nueva cita
  error_sending_customer_email_notification_for_status_change: Error al enviar una notificación por correo electrónico al cliente sobre el cambio de estado
  error_sending_customer_email_notification_for_rescheduled_appointment: Error al enviar una notificación por correo electrónico al cliente para una cita reprogramada
handlers:
  newRequest: "Notificación por correo electrónico del cliente: nueva solicitud"
  pending: "Notificación por correo electrónico del cliente: pendiente"
  confirmed: "Notificación por correo electrónico del cliente: confirmada"
  declined: "Notificación por correo electrónico del cliente: rechazada"
  canceled: "Notificación por correo electrónico del cliente: cancelada"
  noShow: "Notificación por correo electrónico del cliente: no presentarse"
  rescheduled: "Notificación por correo electrónico del cliente: reprogramada"
validation:
  eventTemplate:
    summary:
      required: Se requiere resumen del evento
      min: Se requiere resumen del evento
      max: El resumen del evento no debe tener más de 256 caracteres.
    templateId:
      required: Seleccione una plantilla de evento de calendario
      min: Seleccione una plantilla de evento de calendario
  emailTemplate:
    subject:
      required: El asunto del correo electrónico es obligatorio.
      min: El asunto del correo electrónico es obligatorio.
      max: El asunto del correo electrónico no debe tener más de 256 caracteres.
    templateId:
      required: Seleccione una plantilla de correo
      min: Seleccione una plantilla de correo

