  eventTemplate:
    summary:
      required: Un résumé de l'événement est requis
      min: Un résumé de l'événement est requis
      max: Le résumé de l'événement ne doit pas dépasser 256 caractères
    templateId:
      required: Le modèle d'événement est requis
      min: Le modèle d'événement est requis
