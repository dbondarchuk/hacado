app:
  displayName: Notification par e-mail du client
  description: Envoyez des e-mails personnalisés aux clients concernant leurs rendez-vous - y compris des confirmations, des mises à jour et des annulations - afin qu'ils restent informés à chaque étape du processus.
navigation:
  title: Notification par e-mail du client
new: Notification par e-mail d'un nouveau client
edit: Modifier la notification par e-mail du client
newDescription: Créer une nouvelle notification par e-mail client
editDescription: Mettre à jour la notification par e-mail du client
form:
  pending:
    enabled:
      label: "Envoyer un e-mail lorsqu'un rendez-vous est en attente"
      description: "Envoyé lorsqu'un client demande un rendez-vous et qu'il attend une confirmation."
    templateId:
      label: "Modèle d'e-mail"
      description: "E-mail que les clients reçoivent lorsqu'un rendez-vous est en attente."
      required: "Sélectionnez un modèle d'e-mail"
  confirmed:
    enabled:
      label: "Envoyer un e-mail lorsqu'un rendez-vous est confirmé"
      description: "Envoyé lorsqu'un rendez-vous est confirmé."
    templateId:
      label: "Modèle d'e-mail"
      description: "E-mail que les clients reçoivent lorsqu'un rendez-vous est confirmé."
      required: "Sélectionnez un modèle d'e-mail"
  pendingPackage:
    enabled:
      label: "Envoyer un e-mail différent pour les rendez-vous de forfait en attente"
      description: "Utilisé à la place de l'e-mail en attente lorsque le rendez-vous est couvert par un forfait."
    templateId:
      label: "Modèle d'e-mail"
      description: "E-mail que les clients reçoivent pour un rendez-vous de forfait en attente."
      required: "Sélectionnez un modèle d'e-mail"
  confirmedPackage:
    enabled:
      label: "Envoyer un e-mail différent pour les rendez-vous de forfait confirmés"
      description: "Utilisé à la place de l'e-mail confirmé lorsque le rendez-vous est couvert par un forfait."
    templateId:
      label: "Modèle d'e-mail"
      description: "E-mail que les clients reçoivent pour un rendez-vous de forfait confirmé."
      required: "Sélectionnez un modèle d'e-mail"
  declined:
    enabled:
      label: "Envoyer un e-mail lorsqu'un rendez-vous est refusé"
      description: "Envoyé lorsque vous refusez une demande de réservation."
    templateId:
      label: "Modèle d'e-mail"
      description: "E-mail que les clients reçoivent lorsqu'une demande est refusée."
      required: "Sélectionnez un modèle d'e-mail"
  canceled:
    enabled:
      label: "Envoyer un e-mail lorsqu'un rendez-vous est annulé"
      description: "Envoyé lorsque le client annule, ou lorsque vous enregistrez le rendez-vous comme annulé par le client."
    templateId:
      label: "Modèle d'e-mail"
      description: "E-mail que les clients reçoivent lorsqu'un rendez-vous est annulé."
      required: "Sélectionnez un modèle d'e-mail"
  noShow:
    enabled:
      label: "Envoyer un e-mail lorsqu'un client ne se présente pas"
      description: "Envoyé lorsque vous marquez le client comme non-présenté. Vous pouvez encore l'ignorer pour un rendez-vous."
    templateId:
      label: "Modèle d'e-mail"
      description: "E-mail que les clients reçoivent lorsqu'ils sont marqués comme non-présentés."
      required: "Sélectionnez un modèle d'e-mail"
  rescheduled:
    enabled:
      label: "Envoyer un e-mail lorsqu'un rendez-vous est reporté"
      description: "Envoyé lorsqu'un rendez-vous est reporté."
    templateId:
      label: "Modèle d'e-mail"
      description: "E-mail que les clients reçoivent lorsqu'un rendez-vous est reporté."
      required: "Sélectionnez un modèle d'e-mail"
  calendarEventTemplate:
    enabled:
      label: Inclure un événement de calendrier
      description: "Ajouté à l'e-mail pour que les clients puissent enregistrer le rendez-vous dans leur calendrier."
    templateId:
      label: "Modèle d'événement de calendrier"
      description: "Événement que les clients voient dans leur calendrier."
      required: "Sélectionnez un modèle d'événement de calendrier"
statusText:
  email_app_not_configured: L'expéditeur d'e-mail par défaut n'est pas configuré
  successfully_set_up: Configuration réussie
  error_processing_configuration: Configuration du traitement des erreurs
  error_sending_customer_email_notification_for_new_appointment: Erreur lors de l'envoi d'une notification par e-mail au client pour un nouveau rendez-vous
  error_sending_customer_email_notification_for_status_change: Erreur lors de l'envoi d'une notification par e-mail au client pour un changement de statut
  error_sending_customer_email_notification_for_rescheduled_appointment: Erreur lors de l'envoi d'une notification par e-mail au client pour un rendez-vous reprogrammé
handlers:
  newRequest: Notification par e-mail client – ​​Nouvelle demande
  pending: Notification par e-mail du client – En attente
  confirmed: Notification par e-mail client - Confirmé
  declined: Notification par e-mail du client – Refusé
  canceled: Notification par e-mail client – ​​Annulée
  noShow: Notification par e-mail du client – ​​Non-présentation
  rescheduled: Notification par e-mail client – ​​Reprogrammée
validation:
  eventTemplate:
    summary:
      required: Un résumé de l'événement est requis
      min: Un résumé de l'événement est requis
      max: Le résumé de l'événement ne doit pas dépasser 256 caractères
    templateId:
      required: "Sélectionnez un modèle d'événement de calendrier"
      min: "Sélectionnez un modèle d'événement de calendrier"
  emailTemplate:
    subject:
      required: L'objet de l'e-mail est obligatoire
      min: L'objet de l'e-mail est obligatoire
      max: L'objet de l'e-mail ne doit pas comporter plus de 256 caractères
    templateId:
      required: "Sélectionnez un modèle d'e-mail"
      min: "Sélectionnez un modèle d'e-mail"

