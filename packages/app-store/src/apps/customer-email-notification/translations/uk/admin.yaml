app:
  displayName: Email повідомлення клієнту
  description: Надсилати email повідомлення клієнтам
navigation:
  title: Email повідомлення клієнту
new: Нове email повідомлення клієнту
edit: Редагувати email повідомлення клієнту
newDescription: Створити нове email повідомлення клієнту
editDescription: Оновити email повідомлення клієнту
form:
  pending:
    templateId:
      label: Шаблон email коли очікує
      description: Шаблон email, який побачать ваші клієнти, коли вони забронювали новий запис і він очікує на підтвердження
  confirmed:
    templateId:
      label: Шаблон email коли підтверджено
      description: Шаблон email, який побачать ваші клієнти, коли їхній запис був підтверджений
  declined:
    templateId:
      label: Шаблон email коли відхилено
      description: Надсилається, коли ви відхиляєте запит на бронювання
  canceled:
    templateId:
      label: Шаблон email коли скасовано
      description: Надсилається, коли клієнт скасовує запис, або коли ви фіксуєте скасування клієнтом
  noShow:
    templateId:
      label: Шаблон email для неявки
      description: Необов'язково. Надсилається, коли ви позначаєте клієнта як неявку. Залиште порожнім, щоб нічого не надсилати, або позначте «Не повідомляти клієнта» на записі.
  rescheduled:
    templateId:
      label: Шаблон email коли перенесено
      description: Шаблон email, який побачать ваші клієнти, коли їхній запис був перенесений
  calendarEventTemplate:
    templateId:
      label: Шаблон події календаря
      description: Вміст події, який побачать ваші клієнти в своєму календарі
