app:
  displayName: Email повідомлення клієнту
  description: Надсилати email повідомлення клієнтам
navigation:
  title: Email повідомлення клієнту
new: Нове email повідомлення клієнту
edit: Редагувати email повідомлення клієнту
newDescription: Створити нове email повідомлення клієнту
editDescription: Оновити email повідомлення клієнту
form:
  pending:
    enabled:
      label: Надсилати email, коли запис очікує
      description: Надсилається, коли клієнт просить про запис і він чекає на підтвердження.
    templateId:
      label: Шаблон email
      description: Email, який клієнти отримують, коли запис очікує.
      required: Оберіть шаблон email
  confirmed:
    enabled:
      label: Надсилати email, коли запис підтверджено
      description: Надсилається, коли запис підтверджено.
    templateId:
      label: Шаблон email
      description: Email, який клієнти отримують, коли запис підтверджено.
      required: Оберіть шаблон email
  pendingPackage:
    enabled:
      label: Надсилати інший email для пакетних записів, що очікують
      description: Використовується замість листа про очікування, якщо запис покрито пакетом.
    templateId:
      label: Шаблон email
      description: Email, який клієнти отримують для пакетного запису, що очікує.
      required: Оберіть шаблон email
  confirmedPackage:
    enabled:
      label: Надсилати інший email для підтверджених пакетних записів
      description: Використовується замість листа про підтвердження, якщо запис покрито пакетом.
    templateId:
      label: Шаблон email
      description: Email, який клієнти отримують для підтвердженого пакетного запису.
      required: Оберіть шаблон email
  declined:
    enabled:
      label: Надсилати email, коли запис відхилено
      description: Надсилається, коли ви відхиляєте запит на бронювання.
    templateId:
      label: Шаблон email
      description: Email, який клієнти отримують, коли запит відхилено.
      required: Оберіть шаблон email
  canceled:
    enabled:
      label: Надсилати email, коли запис скасовано
      description: Надсилається, коли клієнт скасовує запис, або коли ви фіксуєте скасування клієнтом.
    templateId:
      label: Шаблон email
      description: Email, який клієнти отримують, коли запис скасовано.
      required: Оберіть шаблон email
  noShow:
    enabled:
      label: Надсилати email, коли клієнт не з’явився
      description: Надсилається, коли ви позначаєте клієнта як неявку. Для окремого запису це все ще можна пропустити.
    templateId:
      label: Шаблон email
      description: Email, який клієнти отримують, коли їх позначено як неявку.
      required: Оберіть шаблон email
  rescheduled:
    enabled:
      label: Надсилати email, коли запис перенесено
      description: Надсилається, коли запис перенесено.
    templateId:
      label: Шаблон email
      description: Email, який клієнти отримують, коли запис перенесено.
      required: Оберіть шаблон email
  calendarEventTemplate:
    enabled:
      label: Додавати подію календаря
      description: Додається до листа, щоб клієнти могли зберегти запис у своєму календарі.
    templateId:
      label: Шаблон події календаря
      description: Подія, яку клієнти бачать у своєму календарі.
      required: Оберіть шаблон події календаря
