app:
  displayName: Customer email notification
  description: Send personalized emails to customers about their appointments - including confirmations, updates, and cancellations - so they stay informed every step of the way
navigation:
  title: Customer email notification
new: New customer email notification
edit: Edit customer email notification
newDescription: Create new customer email notification
editDescription: Update customer email notification
form:
  pending:
    enabled:
      label: Send email when an appointment is pending
      description: Sent when a customer requests an appointment and it is waiting for confirmation.
    templateId:
      label: Email template
      description: The email customers receive when an appointment is pending.
      required: Select an email template
  confirmed:
    enabled:
      label: Send email when an appointment is confirmed
      description: Sent when an appointment is confirmed.
    templateId:
      label: Email template
      description: The email customers receive when an appointment is confirmed.
      required: Select an email template
  pendingPackage:
    enabled:
      label: Send a different email for pending package appointments
      description: Used instead of the pending email when the appointment is covered by a package.
    templateId:
      label: Email template
      description: The email customers receive for a pending package appointment.
      required: Select an email template
  confirmedPackage:
    enabled:
      label: Send a different email for confirmed package appointments
      description: Used instead of the confirmed email when the appointment is covered by a package.
    templateId:
      label: Email template
      description: The email customers receive for a confirmed package appointment.
      required: Select an email template
  declined:
    enabled:
      label: Send email when an appointment is declined
      description: Sent when you decline a booking request.
    templateId:
      label: Email template
      description: The email customers receive when a booking request is declined.
      required: Select an email template
  canceled:
    enabled:
      label: Send email when an appointment is canceled
      description: Sent when the customer cancels, or when you record the appointment as canceled by the customer.
    templateId:
      label: Email template
      description: The email customers receive when an appointment is canceled.
      required: Select an email template
  noShow:
    enabled:
      label: Send email when a customer does not show
      description: Sent when you mark the customer as a no-show. You can still skip it on a single appointment.
    templateId:
      label: Email template
      description: The email customers receive when they are marked as a no-show.
      required: Select an email template
  rescheduled:
    enabled:
      label: Send email when an appointment is rescheduled
      description: Sent when an appointment is rescheduled.
    templateId:
      label: Email template
      description: The email customers receive when an appointment is rescheduled.
      required: Select an email template
  calendarEventTemplate:
    enabled:
      label: Include a calendar event
      description: Added to the email so customers can save the appointment on their calendar.
    templateId:
      label: Calendar event template
      description: The event customers see in their calendar.
      required: Select a calendar event template
statusText:
  email_app_not_configured: Email sender default is not configured
  successfully_set_up: Successfully set up
  error_processing_configuration: Error processing configuration
  error_sending_customer_email_notification_for_new_appointment: Error sending customer email notification for new appointment
  error_sending_customer_email_notification_for_status_change: Error sending customer email notification for status change
  error_sending_customer_email_notification_for_rescheduled_appointment: Error sending customer email notification for rescheduled appointment
handlers:
  newRequest: Customer Email Notification - New Request
  pending: Customer Email Notification - Pending
  confirmed: Customer Email Notification - Confirmed
  declined: Customer Email Notification - Declined
  canceled: Customer Email Notification - Canceled
  noShow: Customer Email Notification - No-show
  rescheduled: Customer Email Notification - Rescheduled
validation:
  eventTemplate:
    summary:
      required: Event summary is required
      min: Event summary is required
      max: Event summary must be no more than 256 characters
    templateId:
      required: Select a calendar event template
      min: Select a calendar event template
  emailTemplate:
    subject:
      required: Email subject is required
      min: Email subject is required
      max: Email subject must be no more than 256 characters
    templateId:
      required: Select an email template
      min: Select an email template
