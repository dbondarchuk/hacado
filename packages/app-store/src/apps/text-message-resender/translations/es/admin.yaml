title: Reenviador de mensajes de texto
app:
  displayName: Reenviador de mensajes de texto
  description: Asegúrese de no perderse nunca la respuesta de un cliente. Cuando un cliente responde a un mensaje de texto, su respuesta se reenvía automáticamente al miembro del equipo asignado, o al miembro predeterminado que usted elija, manteniendo la comunicación fluida y personal.
form:
  defaultMemberId:
    label: Miembro predeterminado
    tooltip: Miembro del equipo que recibe respuestas de clientes cuando el mensaje original no tiene ningún miembro asignado. Se utiliza su número de teléfono. Déjelo vacío para usar el teléfono del instalador de la aplicación.
    placeholder: Seleccione un miembro
  connectWith: Conéctese con <app></app>
statusText:
  successfully_set_up: Configurado exitosamente
  error_processing_configuration: Error al procesar la configuración del reenviador de mensajes de texto
  error_processing_reply: Error al procesar la respuesta del reenviador de mensajes de texto
handlers:
  resendToCustomer: "Reenviador de mensajes de texto: reenviar al cliente"
  processUserReply: "Reenviador de mensajes de texto: procesar respuesta del usuario"
  resendToUser: "Reenviador de mensajes de texto: reenviar al usuario"
  processCustomerReply: "Reenviador de mensajes de texto: procesar la respuesta del cliente"

