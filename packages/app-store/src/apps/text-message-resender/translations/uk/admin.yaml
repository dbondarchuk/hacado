title: Переадресатор текстових повідомлень
app:
  displayName: Переадресатор текстових повідомлень
  description: Переконайтеся, що ви ніколи не пропустите відповідь клієнта. Коли клієнт відповідає на текстове повідомлення, його відповідь автоматично переадресовується призначеному учаснику команди — або учаснику за замовчуванням, якого ви оберете.
form:
  defaultMemberId:
    label: Учасник за замовчуванням
    tooltip: Учасник команди, який отримує відповіді клієнтів, коли у повідомленні немає призначеного учасника. Використовується його номер телефону. Залиште порожнім, щоб використовувати телефон того, хто встановив додаток.
    placeholder: Оберіть учасника
  connectWith: Підключитися з <app></app>
statusText:
  successfully_set_up: Успішно налаштовано
  error_processing_configuration: Помилка обробки конфігурації переадресатора текстових повідомлень
  error_processing_reply: Помилка обробки відповіді переадресатора текстових повідомлень
handlers:
  resendToCustomer: Переадресатор текстових повідомлень - Переадресувати клієнту
  processUserReply: Переадресатор текстових повідомлень - Обробити відповідь користувача
  resendToUser: Переадресатор текстових повідомлень - Переадресувати користувачу
  processCustomerReply: Переадресатор текстових повідомлень - Обробити відповідь клієнта
