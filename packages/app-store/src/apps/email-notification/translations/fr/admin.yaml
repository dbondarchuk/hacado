app:
  displayName: Notification par courrier électronique
  description: Les notifications par e-mail vous tiennent informé de vos rendez-vous grâce à des e-mails automatiques pour les nouvelles réservations, les mises à jour et les annulations, chacun comprenant une pièce jointe d'événement de calendrier pour une planification facile.
