app:
  displayName: Мої сповіщення про запис
  description: |-
    Будьте в курсі своїх зустрічей за допомогою автоматичних сповіщень електронною поштою та SMS.

    Додаток **My Appointment Notifications** дозволяє вам отримувати персоналізовані оновлення щоразу, коли щось змінюється у ваших зустрічах, тримаючи вас у курсі подій, не перевіряючи свій календар Hacado.

    Використовуйте його для:
    - Отримуйте сповіщення про **створення** нових зустрічей.
    - Будьте в курсі, коли зустрічі **підтверджуються або відхиляються**.
    - Отримуйте сповіщення, коли зустрічі **перенесено або скасовано**.
    - Виберіть, чи отримувати сповіщення **електронною поштою, SMS або обома способами**.
    - Слідкуйте за діяльністю зустрічей і залишайтеся в курсі свого розкладу, навіть коли ви далеко від Hacado.
navigation:
  title: Мої сповіщення про запис
form:
  email:
    label: Надіслати на електронну пошту
    tooltip: Електронна адреса для цих сповіщень. Залиште порожнім, щоб використовувати адресу електронної пошти за умовчанням.
    placeholder: john@example.com
  phone:
    label: Номер телефону
    tooltip: Додатковий номер телефону для текстових сповіщень. Ваш телефон використовується за умовчанням.
    placeholder: Телефон
  processOtherMembersAppointments:
    label: Обробляти записи інших учасників
    description: Якщо ввімкнено, також надсилати сповіщення про зустрічі, призначені іншим членам команди.
  schedule:
    label: Коли надсилати
  delivery:
    label: Як відправити
  channel:
    required: Потрібен принаймні один канал. Увімкніть електронну пошту, текстові повідомлення або обидва варіанти.
  emailChannel:
    label: Електронна пошта
    description: Надішліть це сповіщення у свою папку "Вхідні" з вкладенням календаря, якщо воно доступне.
  textMessage:
    label: Текстове повідомлення
    description: Надішліть це сповіщення текстовим повідомленням.
    smsDisabled: Текстові повідомлення потрібно ввімкнути. Поки він вимкнений, цей параметр залишається недоступним.
    smsDisabledAction: Увімкніть текстові повідомлення
  events:
    pending:
      enabled:
        label: Новий запит на зустріч
        description: Надсилається, коли клієнт запитує запис на зустріч, який ще потребує підтвердження.
    confirmed:
      enabled:
        label: Запис підтверджено
        description: Надсилається після підтвердження зустрічі, включаючи автоматично підтверджені бронювання.
    declined:
      enabled:
        label: Запис відхилено
        description: Надсилається, коли ви відхиляєте запит на бронювання.
    canceled:
      enabled:
        label: Запис скасовується
        description: Надсилається, коли зустріч скасовується.
    noShow:
      enabled:
        label: Неявка клієнта
        description: Надсилається, коли ви позначаєте клієнта як такого, що не з’явився.
    rescheduled:
      enabled:
        label: Запис перенесено
        description: Надсилається при зміні часу запису.
  update: Оновити <app></app>
  add: Додати <app></app>
