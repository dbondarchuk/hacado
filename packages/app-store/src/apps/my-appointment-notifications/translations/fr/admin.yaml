app:
  displayName: Mes notifications de rendez-vous
  description: |-
    Restez informé de vos rendez-vous grâce aux notifications automatiques par e-mail et SMS.

    L'application **Mes notifications de rendez-vous** vous permet de recevoir des mises à jour personnalisées chaque fois que quelque chose change avec vos rendez-vous, vous tenant au courant sans consulter constamment votre calendrier Hacado.

    Utilisez-le pour :
    - Recevez des notifications lorsque de nouveaux rendez-vous sont **créés**.
    - Restez informé lorsque les rendez-vous sont **confirmés ou refusés**.
    - Soyez averti lorsque les rendez-vous sont **reprogrammés ou annulés**.
    - Choisissez de recevoir des notifications par **e-mail, SMS ou les deux**.
    - Gardez une trace de l'activité des rendez-vous et restez maître de votre emploi du temps, même lorsque vous êtes loin de Hacado.
navigation:
  title: Mes notifications de rendez-vous
form:
  email:
    label: Envoyer par e-mail
    tooltip: Adresse e-mail pour ces alertes. Laissez vide pour utiliser votre adresse e-mail par défaut.
    placeholder: john@exemple.com
  phone:
    label: Numéro de téléphone
    tooltip: Numéro de téléphone facultatif pour les alertes SMS. Votre téléphone est utilisé par défaut.
    placeholder: Téléphone
  processOtherMembersAppointments:
    label: Traiter les nominations des autres membres
    description: Lorsqu'il est activé, envoyez également des notifications pour les rendez-vous attribués aux autres membres de l'équipe.
  schedule:
    label: Quand envoyer
  delivery:
    label: Comment envoyer
  channel:
    required: Au moins un canal est requis. Activez le courrier électronique, les SMS ou les deux.
  emailChannel:
    label: E-mail
    description: Envoyez cette alerte dans votre boîte de réception, avec une pièce jointe de calendrier lorsqu'elle est disponible.
  textMessage:
    label: SMS
    description: Envoyez cette alerte par SMS.
    smsDisabled: Les messages texte doivent être activés. Tant qu'elle est désactivée, cette option reste indisponible.
    smsDisabledAction: Activer la messagerie texte
  events:
    pending:
      enabled:
        label: Nouvelle demande de rendez-vous
        description: Envoyé lorsqu'un client demande un rendez-vous qui doit encore être confirmé.
    confirmed:
      enabled:
        label: Rendez-vous confirmé
        description: Envoyé lorsqu'un rendez-vous est confirmé, y compris les réservations automatiquement confirmées.
    declined:
      enabled:
        label: Rendez-vous refusé
        description: Envoyé lorsque vous refusez une demande de réservation.
    canceled:
      enabled:
        label: Rendez-vous annulé
        description: Envoyé lorsque le rendez-vous est annulé.
    noShow:
      enabled:
        label: Non-présentation du client
        description: Envoyé lorsque vous marquez le client comme non-présenté.
    rescheduled:
      enabled:
        label: Rendez-vous reporté
        description: Envoyé lorsque l'heure du rendez-vous change.
  update: Mettre à jour <app></app>
  add: Ajouter <app></app>
