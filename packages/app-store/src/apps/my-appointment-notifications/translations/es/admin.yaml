app:
  displayName: Mis notificaciones de citas
  description: |-
    Manténgase informado sobre sus citas con notificaciones automáticas por correo electrónico y SMS.

    La aplicación **Mis notificaciones de citas** te permite recibir actualizaciones personalizadas cada vez que algo cambia con tus citas, manteniéndote actualizado sin revisar constantemente tu calendario de Hacado.

    Úselo para:
    - Reciba notificaciones cuando se **creen** nuevas citas.
    - Manténgase informado cuando las citas sean **confirmadas o rechazadas**.
    - Reciba notificaciones cuando las citas sean **reprogramadas o canceladas**.
    - Elija si desea recibir notificaciones por **correo electrónico, SMS o ambos**.
    - Realice un seguimiento de la actividad de las citas y manténgase al tanto de su agenda, incluso cuando esté lejos de Hacado.
navigation:
  title: Mis notificaciones de citas
form:
  email:
    label: Enviar al correo electrónico
    tooltip: Dirección de correo electrónico para estas alertas. Déjelo vacío para usar su dirección de correo electrónico predeterminada.
    placeholder: juan@ejemplo.com
  phone:
    label: Número de teléfono
    tooltip: Número de teléfono opcional para alertas de texto. Su teléfono se utiliza de forma predeterminada.
    placeholder: Teléfono
  processOtherMembersAppointments:
    label: Procesar los nombramientos de otros miembros
    description: Cuando esté habilitado, también envíe notificaciones de citas asignadas a otros miembros del equipo.
  schedule:
    label: cuando enviar
  delivery:
    label: como enviar
  channel:
    required: Se requiere al menos un canal. Active el correo electrónico, los mensajes de texto o ambos.
  emailChannel:
    label: Correo electrónico
    description: Envíe esta alerta a su bandeja de entrada, con un calendario adjunto cuando esté disponible.
  textMessage:
    label: mensaje de texto
    description: Envía esta alerta por mensaje de texto.
    smsDisabled: Los mensajes de texto necesitan estar activados. Mientras esté desactivada, esta opción no estará disponible.
    smsDisabledAction: Activar mensajes de texto
  events:
    pending:
      enabled:
        label: Nueva solicitud de cita
        description: Enviado cuando un cliente solicita una cita que aún necesita confirmación.
    confirmed:
      enabled:
        label: Cita confirmada
        description: Se envía cuando se confirma una cita, incluidas las reservas confirmadas automáticamente.
    declined:
      enabled:
        label: Cita rechazada
        description: Enviado cuando rechaza una solicitud de reserva.
    canceled:
      enabled:
        label: Cita cancelada
        description: Enviado cuando se cancela la cita.
    noShow:
      enabled:
        label: Cliente no presentado
        description: Se envía cuando marcas al cliente como no presentado.
    rescheduled:
      enabled:
        label: Cita reprogramada
        description: Enviado cuando cambia el horario de la cita.
  update: Actualización <app></app>
  add: Agregar <app></app>
