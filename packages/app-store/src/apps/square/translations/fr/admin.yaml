  locationId:
    required: L'identifiant de l'emplacement carré est requis
  merchantId:
    required: L’identifiant du commerçant Square est requis
  paymentIntentId:
    required: L'identifiant de l'intention de paiement est requis
  sourceId:
    required: L'identifiant de la source de paiement est requis

