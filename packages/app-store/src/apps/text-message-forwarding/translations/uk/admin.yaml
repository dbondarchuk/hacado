  error_processing_reply: Помилка обробки відповіді переадресації текстових повідомлень
handlers:
  resendToCustomer: Переадресація текстових повідомлень - Переадресувати клієнту
  processUserReply: Переадресація текстових повідомлень - Обробити відповідь користувача
  resendToUser: Переадресація текстових повідомлень - Переадресувати користувачу
