title: Text Message Forwarding
app:
  displayName: Text Message Forwarding
  description: Ensure you never miss a customer response. When a customer replies to a text message, their reply is automatically forwarded to the assigned team member - or a default member you choose - keeping communication seamless and personal.
form:
  defaultMemberId:
    label: Default member
    tooltip: Team member who receives customer replies when the original message has no assigned member. Their phone number is used. Leave empty to use the app installer's phone.
    placeholder: Select a member
  connectWith: Connect with <app></app>
statusText:
  successfully_set_up: Successfully set up
  error_processing_configuration: Error processing Text Message Forwarding configuration
  error_processing_reply: Error processing Text Message Forwarding reply
handlers:
  resendToCustomer: Text Message Forwarding - Resend to customer
  processUserReply: Text Message Forwarding - Process user reply
  resendToUser: Text Message Forwarding - Resend to user
  processCustomerReply: Text Message Forwarding - Process customer reply
