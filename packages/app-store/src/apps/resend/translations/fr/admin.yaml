statusText:
  successfully_connected: Connexion réussie à Renvoyer
  successfully_configured: Paramètres de l'expéditeur enregistrés
  error_processing_configuration: Erreur de traitement Renvoyer la configuration
  oauth_error: Erreur d'authentification OAuth
