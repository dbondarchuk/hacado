title: Resend
app:
  displayName: Resend
  description: Resend is a modern email API for developers. Connect your Resend account with OAuth to send transactional email from your verified domain.
form:
  connect: Connect with <app></app>
  reconnect: Reconnect <app></app>
  pendingAuthorization: Pending authorization
  fromEmail:
    label: Sender email
    placeholder: hello@yourdomain.com
    tooltip: Must be an address on a domain verified in your Resend account
  fromName:
    label: Sender name
    placeholder: Your business
    tooltip: Optional display name shown in the From field
  save: Save sender settings
  saveSuccess: Sender settings saved
  saveError: Failed to save sender settings
statusText:
  successfully_connected: Successfully connected to Resend
  successfully_configured: Sender settings saved
  error_processing_configuration: Error processing Resend configuration
  oauth_error: OAuth authentication error
  missing_oauth_config: Resend OAuth client is not configured
  refresh_token_not_set: Refresh token is not set
  redirect_request_does_not_contain_app_id: Redirect request does not contain app ID
  redirect_request_does_not_contain_authorization_code: Redirect request does not contain authorization code
  app_was_not_authorized_properly: App was not authorized properly
  pkce_verifier_missing: OAuth PKCE verifier is missing. Start the connection again.
  requires_sender_settings: Requires sender settings
  from_email_not_configured: Sender email is not configured
  error_sending_email: Error sending email via Resend
  error_parsing_ical_event: Failed to parse iCal event
validation:
  fromEmail:
    invalid: Sender email must be a valid email address
  fromName:
    max: Sender name must be at most 256 characters
needsAttention:
  sender:
    title: Finish Resend setup
    description: Add sender settings so transactional email can be sent.
    action: Configure
