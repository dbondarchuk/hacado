app:
  displayName: Customer text message notification
  description: Send personalized text message notifications to customers about their appointments - including confirmations, updates, and cancellations - so they stay informed every step of the way
navigation:
  title: Customer text message notification
new: New customer text message notification
edit: Edit customer text message notification
newDescription: Create new customer text message notification
editDescription: Update customer text message notification
form:
  message:
    description:
      pending: Sent when a booking is created and still needs confirmation. The text names the business, service, and time, and includes a manage link when one exists.
      confirmed: Sent when a booking is confirmed immediately, or when you later confirm a pending appointment. The text names the business, service, and time.
      declined: Sent when you decline the appointment. The text names the business, service, and time.
      canceled: Sent when the appointment is canceled. The text names the business, service, and time.
      noShow: Sent when you mark the appointment as a no-show. The text names the business, service, and time.
      rescheduled: Sent when the appointment time changes, unless that change is set not to notify the customer. The text includes the new time.
statusText:
  text_message_app_not_configured: Text message sender default app is not configured
