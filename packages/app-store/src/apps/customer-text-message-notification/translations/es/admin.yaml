app:
  displayName: Notificación por mensaje de texto al cliente
  description: Envíe notificaciones personalizadas por mensaje de texto a los clientes sobre sus citas, incluidas confirmaciones, actualizaciones y cancelaciones, para que se mantengan informados en cada paso del camino.
navigation:
  title: Notificación por mensaje de texto al cliente
new: Notificación de mensaje de texto de nuevo cliente
edit: Editar notificación de mensaje de texto del cliente
newDescription: Crear notificación de mensaje de texto de nuevo cliente
editDescription: Actualizar notificación de mensaje de texto del cliente
form:
  template:
    label: Plantilla de texto
  message:
    description:
      pending: Se envía cuando se crea una reserva que aún necesita confirmación. El texto incluye el negocio, el servicio y la hora, y un enlace para gestionarla cuando existe.
      confirmed: Se envía cuando una reserva se confirma al momento, o cuando más tarde confirmas una cita pendiente. El texto incluye el negocio, el servicio y la hora.
      declined: Se envía cuando rechazas la cita. El texto incluye el negocio, el servicio y la hora.
      canceled: Se envía cuando la cita se cancela. El texto incluye el negocio, el servicio y la hora.
      noShow: Se envía cuando marcas la cita como ausencia. El texto incluye el negocio, el servicio y la hora.
      rescheduled: Se envía cuando cambia la hora de la cita, salvo que el cambio esté marcado para no avisar al cliente. El texto incluye la nueva hora.
statusText:
  text_message_app_not_configured: La aplicación predeterminada del remitente de mensajes de texto no está configurada
  successfully_set_up: Configurado exitosamente
  error_processing_configuration: Error al procesar la configuración de notificación de mensajes de texto del cliente
  error_sending_customer_text_message_notification_for_new_appointment: Error al enviar notificación por mensaje de texto al cliente para una nueva cita
  error_sending_customer_text_message_notification_for_status_change: Error al enviar notificación por mensaje de texto al cliente para cambio de estado
  error_sending_customer_text_message_notification_for_rescheduled_appointment: Error al enviar una notificación por mensaje de texto al cliente para una cita reprogramada
handlers:
  newRequest: "Notificación por mensaje de texto del cliente: nueva solicitud"
  pending: "Notificación de mensaje de texto del cliente: pendiente"
  confirmed: "Notificación por mensaje de texto del cliente: confirmada"
  declined: "Notificación de mensaje de texto del cliente: rechazada"
  canceled: "Notificación de mensaje de texto del cliente: cancelada"
  noShow: "Notificación por mensaje de texto del cliente: no presentarse"
  rescheduled: "Notificación por mensaje de texto del cliente: reprogramada"

