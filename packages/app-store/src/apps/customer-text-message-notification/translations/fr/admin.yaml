app:
  displayName: Notification par SMS du client
  description: Envoyez des notifications personnalisées par SMS aux clients concernant leurs rendez-vous - y compris les confirmations, les mises à jour et les annulations - afin qu'ils restent informés à chaque étape du processus.
navigation:
  title: Notification par SMS du client
new: Notification par SMS d’un nouveau client
edit: Modifier la notification par SMS du client
newDescription: Créer une nouvelle notification par SMS client
editDescription: Mettre à jour la notification par SMS du client
form:
  template:
    label: Modèle de texto
  message:
    description:
      pending: "Envoyé quand une réservation est créée et attend encore une confirmation. Le texte indique l'entreprise, le service et l'heure, et un lien de gestion lorsqu'il existe."
      confirmed: "Envoyé quand une réservation est confirmée tout de suite, ou quand vous confirmez plus tard une demande en attente. Le texte indique l'entreprise, le service et l'heure."
      declined: "Envoyé quand vous refusez le rendez-vous. Le texte indique l'entreprise, le service et l'heure."
      canceled: "Envoyé quand le rendez-vous est annulé. Le texte indique l'entreprise, le service et l'heure."
      noShow: "Envoyé quand vous marquez le rendez-vous comme une absence. Le texte indique l'entreprise, le service et l'heure."
      rescheduled: "Envoyé quand l'heure du rendez-vous change, sauf si le changement est marqué pour ne pas prévenir le client. Le texte indique la nouvelle heure."
statusText:
  text_message_app_not_configured: L'application par défaut de l'expéditeur de messages texte n'est pas configurée
  successfully_set_up: Configuration réussie
  error_processing_configuration: Erreur lors du traitement de la configuration de la notification par SMS du client
  error_sending_customer_text_message_notification_for_new_appointment: Erreur lors de l'envoi d'une notification par SMS au client pour un nouveau rendez-vous
  error_sending_customer_text_message_notification_for_status_change: Erreur lors de l'envoi d'une notification par SMS au client pour un changement de statut
  error_sending_customer_text_message_notification_for_rescheduled_appointment: Erreur lors de l'envoi d'une notification par SMS au client pour un rendez-vous reprogrammé
handlers:
  newRequest: Notification par message texte client - Nouvelle demande
  pending: Notification par message texte client - En attente
  confirmed: Notification par message texte client - Confirmé
  declined: Notification par message texte client – ​​Refusé
  canceled: Notification par message texte client – ​​Annulée
  noShow: Notification par SMS du client – ​​Non-présentation
  rescheduled: Notification par message texte client – ​​Reprogrammée

