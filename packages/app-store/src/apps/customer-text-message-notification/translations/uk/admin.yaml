form:
  message:
    description:
      pending: Надсилається, коли бронювання створено і ще чекає підтвердження. Текст містить назву бізнесу, послугу й час, а також посилання для керування, якщо воно є.
      confirmed: Надсилається, коли бронювання одразу підтверджено, або коли ви пізніше підтверджуєте очікуваний запис. Текст містить назву бізнесу, послугу й час.
      declined: Надсилається, коли ви відхиляєте запис. Текст містить назву бізнесу, послугу й час.
      canceled: Надсилається, коли запис скасовано. Текст містить назву бізнесу, послугу й час.
      noShow: Надсилається, коли ви позначаєте запис як неявку. Текст містить назву бізнесу, послугу й час.
      rescheduled: Надсилається, коли змінюється час запису, якщо зміну не позначено як без сповіщення клієнта. Текст містить новий час.
