app:
  displayName: URL Зайняті Події
  description: Підключіться до зовнішнього URL для отримання даних зайнятих подій для інтеграції з календарем.
form:
  url:
    label: URL
    placeholder: "https://example.com/api/busy-events?start='{{start}}'&end='{{end}}'"
    description: "Використовуйте плейсхолдери, які підставляються під час виклику: <code>'{{start}}'</code> та <code>'{{end}}'</code> (дата/час у ISO).<br></br>Приклад: <code>https://example.com/api/busy-events?start='{{start}}'&end='{{end}}'</code>."
    tooltip: URL-адреса кінцевої точки з даними зайнятих подій. Нічого не додається автоматично - вкажіть потрібні плейсхолдери в URL.
  headers:
    label: Заголовки
    addButton: Додати заголовок
    keyLabel: Назва заголовка
    keyPlaceholder: Authorization
    valueLabel: Значення заголовка
    valuePlaceholder: Bearer token
    removeButton: Видалити
    description: "Назви та значення заголовків підтримують ті самі плейсхолдери: <code>'{{start}}'</code> та <code>'{{end}}'</code>."
    tooltip: Додаткові HTTP-заголовки. Плейсхолдери підставляються під час кожного запиту.
  connect: Підключитися з <app></app>
validation:
  form:
    url:
      required: URL обов'язковий
      url: Будь ласка, введіть дійсний URL
      max: URL не може бути більше 2048 символів
    headers:
      key:
        required: Назва заголовка обов'язкова
        unique: Назва заголовка повинна бути унікальною
        max: Назва заголовка не може бути більше 256 символів
      value:
        required: Значення заголовка обов'язкове
        max: Значення заголовка не може бути більше 4096 символів
statusText:
  successfully_connected: Успішно підключено до провайдера зайнятих подій URL
  error_processing_configuration: Помилка обробки конфігурації
  error_fetching_busy_times: Помилка отримання зайнятих часів з URL
  invalid_response_format: Недійсний формат відповіді з URL
