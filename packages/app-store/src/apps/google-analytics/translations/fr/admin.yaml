  request_error: Il y a eu un problème avec votre demande.
  stream_list_error: Échec de la récupération de la liste des flux de données
needsAttention:
  dataStream:
    title: Terminer la configuration de Google Analytics
    description: Sélectionnez un flux de données pour que le suivi du site Web et des conversions puisse démarrer.
