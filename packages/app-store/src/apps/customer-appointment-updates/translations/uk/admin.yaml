  text_message_app_not_configured: Додаток відправника текстових повідомлень за умовчанням не налаштовано
  successfully_set_up: Успішно налаштовано
  error_processing_configuration: Помилка обробки конфігурації
  error_sending_customer_appointment_updates_for_new_appointment: Помилка надсилання оновлення запису клієнта для нового запису
  error_sending_customer_appointment_updates_for_status_change: Помилка надсилання оновлення запису на прийом клієнта для зміни статусу
  error_sending_customer_appointment_updates_for_rescheduled_appointment: Помилка надсилання оновлення запису клієнта для перенесеної зустрічі
