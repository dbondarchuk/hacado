app:
  displayName: Оновлення про запис для клієнтів
  description: |-
    Тримайте своїх клієнтів в курсі за допомогою автоматичного оновлення статусу записів.

    Програма **Customer Appointment Updates** дозволяє вам автоматично надсилати персоналізовані електронні листи або SMS-повідомлення щоразу, коли записується на зустріч або змінюється її статус — ручна робота не потрібна.

    Використовуйте його для:
    - Повідомляйте клієнтів, коли їхній запит на зустріч буде **отримано**.
    - Надсилати оновлення, коли зустрічі **підтверджуються або відхиляються**.
    - Інформуйте клієнтів, коли їхні зустрічі **перенесено або скасовано**.
    - Налаштуйте шаблони повідомлень як для каналів електронної пошти, так і для SMS.
    - Інформуйте клієнтів протягом усього процесу бронювання, зменшуйте плутанину та забезпечуйте кращий досвід бронювання — усе автоматично.
navigation:
  title: Оновлення про запис для клієнтів
form:
  events:
    pending:
      label: Очікує підтвердження
      description: Надсилається, коли клієнт просить записатися на зустріч і очікує на підтвердження.
    confirmed:
      label: Запис підтверджено
      description: Надсилається, коли бронювання підтверджується одразу або коли ви пізніше підтверджуєте незавершену зустріч.
    declined:
      label: Запис відхилено
      description: Надсилається, коли ви відхиляєте запит на бронювання.
    canceled:
      label: Запис скасовується
      description: Надсилається, коли клієнт скасовує або коли ви записуєте зустріч як скасовану клієнтом.
    noShow:
      label: Клієнт не з'явився
      description: Надсилається, коли ви позначаєте клієнта як такого, що не з’явився. Ви все одно можете пропустити це під час однієї зустрічі.
    rescheduled:
      label: Запис перенесена
      description: Надсилається, коли час зустрічі змінюється, якщо ця зміна не налаштована на сповіщення клієнта.
  howToSend:
    label: Як відправити
  email:
    label: Електронна пошта
    description: Надішліть клієнту електронний лист.
  emailTemplate:
    label: Шаблон електронної пошти
    description: Електронна пошта, яку клієнти отримують для цього оновлення.
  text:
    label: Текстове повідомлення
    description: Надішліть клієнту текстове повідомлення. Використовується вбудоване повідомлення, якщо ви не виберете спеціальний шаблон.
  packageEmails:
    pendingPackage:
      enabled:
        label: Надішліть іншу електронну пошту для незавершених зустрічей
        description: Використовується замість електронного листа, що очікує на розгляд, коли зустріч покривається пакетом.
      templateId:
        label: Шаблон електронної пошти
        description: Електронна пошта, яку клієнти отримують для незавершеної зустрічі з пакетом.
    confirmedPackage:
      enabled:
        label: Надішліть іншу електронну адресу для підтверджених записів на пакет
        description: Використовується замість підтвердженої електронної пошти, коли зустріч покривається пакетом.
      templateId:
        label: Шаблон електронної пошти
        description: Електронна пошта, яку клієнти отримують для підтвердженого запису на пакет.
  calendarEventTemplate:
    enabled:
      label: Додайте подію календаря
      description: Додано до електронних листів, щоб клієнти могли зберегти зустріч у своєму календарі. Це не впливає на текстові повідомлення.
    templateId:
      label: Шаблон події календаря
      description: Подія, яку клієнти бачать у своєму календарі.
