  error_sending_customer_appointment_updates_for_status_change: Erreur lors de l'envoi de la mise à jour du rendez-vous client pour le changement de statut
  error_sending_customer_appointment_updates_for_rescheduled_appointment: Erreur lors de l'envoi de la mise à jour du rendez-vous client pour un rendez-vous reprogrammé
