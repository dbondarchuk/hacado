app:
  displayName: Mises à jour des rendez-vous clients
  description: |-
    Tenez vos clients informés grâce aux mises à jour automatiques de l'état des rendez-vous.

    L'application **Mises à jour des rendez-vous clients** vous permet d'envoyer automatiquement des e-mails ou des SMS personnalisés chaque fois qu'un rendez-vous est créé ou que son statut change, aucun travail manuel n'est requis.

    Utilisez-le pour :
    - Informer les clients lorsque leur demande de rendez-vous est **reçue**.
    - Envoyez des mises à jour lorsque les rendez-vous sont **confirmés ou refusés**.
    - Informer les clients lorsque leurs rendez-vous sont **reprogrammés ou annulés**.
    - Personnalisez les modèles de messages pour les canaux e-mail et SMS.
    - Tenez les clients informés tout au long du processus de réservation, réduisez la confusion et offrez une meilleure expérience de réservation, le tout automatiquement.
navigation:
  title: Mises à jour des rendez-vous clients
form:
  events:
    pending:
      label: Le rendez-vous est en attente
      description: Envoyé lorsqu'un client demande un rendez-vous et qu'il attend une confirmation.
    confirmed:
      label: Le rendez-vous est confirmé
      description: Envoyé lorsqu'une réservation est confirmée immédiatement ou lorsque vous confirmez ultérieurement un rendez-vous en attente.
    declined:
      label: Le rendez-vous est refusé
      description: Envoyé lorsque vous refusez une demande de réservation.
    canceled:
      label: Le rendez-vous est annulé
      description: Envoyé lorsque le client annule ou lorsque vous enregistrez le rendez-vous comme annulé par le client.
    noShow:
      label: Le client ne se présente pas
      description: Envoyé lorsque vous marquez le client comme non-présenté. Vous pouvez toujours l’ignorer sur un seul rendez-vous.
    rescheduled:
      label: Le rendez-vous est reporté
      description: Envoyé lorsque l'heure du rendez-vous change, sauf si ce changement est configuré pour ne pas informer le client.
  howToSend:
    label: Comment envoyer
  email:
    label: E-mail
    description: Envoyez un e-mail au client.
  emailTemplate:
    label: Modèle d'e-mail
    description: L'e-mail que les clients reçoivent pour cette mise à jour.
  text:
    label: SMS
    description: Envoyez un SMS au client. Un message intégré est utilisé sauf si vous choisissez un modèle personnalisé.
  packageEmails:
    pendingPackage:
      enabled:
        label: Envoyer un e-mail différent pour les rendez-vous en attente
        description: Utilisé à la place de l'email en attente lorsque le rendez-vous est couvert par un forfait.
      templateId:
        label: Modèle d'e-mail
        description: L'e-mail que les clients reçoivent pour un rendez-vous de package en attente.
    confirmedPackage:
      enabled:
        label: Envoyer un e-mail différent pour les rendez-vous confirmés pour les forfaits
        description: Utilisé à la place de l'email confirmé lorsque le rendez-vous est couvert par un forfait.
      templateId:
        label: Modèle d'e-mail
        description: L'e-mail que les clients reçoivent pour un rendez-vous confirmé pour un forfait.
  calendarEventTemplate:
    enabled:
      label: Inclure un événement de calendrier
      description: Ajouté aux e-mails afin que les clients puissent enregistrer le rendez-vous sur leur calendrier. Les messages texte ne sont pas affectés.
    templateId:
      label: Modèle d'événement de calendrier
      description: L'événement que les clients voient dans leur calendrier.
statusText:
  email_app_not_configured: L'expéditeur d'e-mail par défaut n'est pas configuré
  text_message_app_not_configured: L'application par défaut de l'expéditeur de messages texte n'est pas configurée
