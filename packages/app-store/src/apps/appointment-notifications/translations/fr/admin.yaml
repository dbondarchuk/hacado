title: Notifications de rendez-vous
app:
  displayName: Notifications de rendez-vous
  description: |-
    Automatisez la communication avec vos clients avec des rappels et des suivis intelligents.
    L'application **Appointment Notifications** vous permet d'envoyer automatiquement des e-mails ou des SMS personnalisés **avant ou après** les rendez-vous - aucun travail manuel n'est requis.
    Utilisez-le pour :
    - Envoyez des **rappels de rendez-vous** quelques heures ou jours avant chaque réservation.
    - Planifiez des **messages de suivi** après les rendez-vous pour remercier les clients, demander des avis ou partager les prochaines étapes.
    - Choisissez parmi des options d'horaires flexibles telles que « 2 heures avant », « 1 jour après » ou « à 19h00 la veille ».
    - Personnalisez les modèles de messages pour les canaux e-mail et SMS.
    - Tenez vos clients informés, réduisez les non-présentations et établissez des relations plus solides après les rendez-vous, le tout automatiquement.
