title: Notificaciones de citas
app:
  displayName: Notificaciones de citas
  description: |-
    Automatice la comunicación con sus clientes con recordatorios y seguimientos inteligentes.
    La aplicación **Notificaciones de citas** le permite enviar automáticamente correos electrónicos o mensajes de texto personalizados **antes o después** de las citas, sin necesidad de trabajo manual.
    Úselo para:
    - Envía **recordatorios de citas** unas horas o días antes de cada reserva.
    - Programe **mensajes de seguimiento** después de las citas para agradecer a los clientes, solicitar revisiones o compartir los próximos pasos.
    - Elija entre opciones de horarios flexibles como "2 horas antes", "1 día después" o "a las 7:00 p. m. del día anterior".
    - Personalizar plantillas de mensajes para canales de correo electrónico y SMS.
    - Mantenga informados a sus clientes, reduzca las ausencias y establezca relaciones más sólidas después de la cita, todo de forma automática.
