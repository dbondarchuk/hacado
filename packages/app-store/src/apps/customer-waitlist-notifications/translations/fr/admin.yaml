app:
  displayName: Notifications de liste d'attente des clients
  description: Envoyez un e-mail aux clients lorsqu'ils rejoignent votre liste d'attente et informez-les lorsqu'une heure correspondante s'ouvre afin qu'ils puissent réserver ou partir.
navigation:
  title: Liste d'attente des clients
setup:
  update: Mettre à jour <app></app>
  add: Ajouter <app></app>
  form:
    customerNewEntryEmail:
      label: "Envoyer un e-mail à l'inscription sur la liste d'attente"
      description: "Envoyé lorsqu'un client rejoint la liste d'attente."
    customerNewEntryTemplateId:
      label: "Modèle d'e-mail"
      tooltip: "E-mail que les clients reçoivent lorsqu'ils rejoignent la liste d'attente."
      placeholder: ID du modèle
      required: "Sélectionnez un modèle d'e-mail"
    notifyOnSlotOpened:
      label: "Avertir lorsqu'un créneau souhaité s'ouvre"
      tooltip: "Proposez la demande correspondante la plus ancienne lorsqu'une heure se libère. Activez l'e-mail, le message texte, ou les deux."
    slotOpenedEmail:
      label: "Envoyer un e-mail lorsqu'un créneau s'ouvre"
      description: "Envoyé lorsqu'une heure correspondante se libère et que cette demande est la suivante."
    slotOpenedEmailTemplateId:
      label: "Modèle d'e-mail"
      tooltip: "E-mail que les clients reçoivent lorsqu'une heure correspondante s'ouvre."
      required: "Sélectionnez un modèle d'e-mail"
    slotOpenedSmsTemplateId:
      label: Modèle de message personnalisé
      tooltip: "Facultatif. Lorsqu'un modèle est sélectionné, le message de créneau ouvert l'utilise à la place du message intégré."
    slotOpenedSms:
      label: SMS quand un créneau s'ouvre
      description: "Envoyé quand une heure correspondante se libère et que cette demande est la suivante. Le texte indique l'entreprise, le service et l'heure, avec un lien pour réserver."
    leaveWaitlistSmsTemplateId:
      label: Modèle de message personnalisé
      tooltip: "Facultatif. Lorsqu'un modèle est sélectionné, la confirmation de départ l'utilise à la place du message intégré."
    leaveWaitlistSms:
      label: SMS quand le client part
      description: "Envoyé après que le client quitte cette demande via le lien ou en répondant avec le mot-clé de sortie."
      required: "Activez-le lorsque les SMS de créneau ouvert sont activés, pour que le client reçoive une confirmation."
    bookingPageId:
      label: Page de réservation
      tooltip: Page utilisée pour les URL de livre à partir d'un lien.
      required: Sélectionnez une page de réservation
    cooldownMinutes:
      label: Temps de recharge entre les offres
      tooltip: Délai minimum avant que la même demande de liste d'attente puisse se voir proposer un autre créneau ouvert.
      required: Choisissez un temps de recharge entre 15 minutes et 30 jours
    exclusiveAccessMinutes:
      label: Fenêtre d'accès exclusif
      tooltip: Combien de temps la personne actuelle doit-elle réserver avant que la personne suivante sur la liste se voie proposer le même créneau. Zero propose immédiatement la personne suivante.
      required: Choisissez 0 à 60 minutes
    smsRemoveKeyword:
      label: Mot-clé de congé par SMS
      tooltip: Les clients répondent avec ce mot (dans tous les cas) pour quitter cette demande de liste d'attente. Obligatoire lorsque le SMS avec emplacement ouvert est défini.
      placeholder: RETIRER
      required: Saisissez un mot-clé que les clients peuvent envoyer par SMS pour quitter
    slotOpenedChannel:
      required: "Activez l'e-mail, le message texte, ou les deux."
handlers:
  newWaitlistEntry: Notification de liste d'attente client - Nouvelle entrée
  slotOpened: Notification de liste d'attente client - Emplacement ouvert
  leaveWaitlist: Notification de liste d'attente client - Liste d'attente quittée
statusText:
  successfully_set_up: Configurer avec succès les notifications de liste d'attente des clients
  error_sending_email_notification_for_new_waitlist_entry: Erreur lors de l'envoi d'une notification par e-mail pour une nouvelle entrée sur la liste d'attente
  email_app_not_configured: L'application par défaut de l'expéditeur d'e-mail n'est pas configurée
  error_processing_configuration: Configuration du traitement des erreurs
