app:
  displayName: Notificaciones de lista de espera de clientes
  description: Envíe un correo electrónico a los clientes cuando se unan a su lista de espera y notifíqueles cuando se abra un horario coincidente para que puedan reservar o irse.
navigation:
  title: Lista de espera de clientes
setup:
  update: Actualización <app></app>
  add: Agregar <app></app>
  form:
    customerNewEntryEmail:
      label: Enviar correo al unirse a la lista de espera
      description: Se envía cuando un cliente se une a la lista de espera.
    customerNewEntryTemplateId:
      label: Plantilla de correo
      tooltip: Correo que reciben los clientes cuando se unen a la lista de espera.
      placeholder: ID de plantilla
      required: Seleccione una plantilla de correo
    notifyOnSlotOpened:
      label: Notificar cuando se abre un horario deseado
      tooltip: Ofrezca la solicitud coincidente más antigua cuando un horario quede libre. Active el correo, el mensaje de texto o ambos.
    slotOpenedEmail:
      label: Enviar correo cuando se abre un horario
      description: Se envía cuando queda libre un horario que coincide y esta solicitud es la siguiente.
    slotOpenedEmailTemplateId:
      label: Plantilla de correo
      tooltip: Correo que reciben los clientes cuando se abre un horario coincidente.
      required: Seleccione una plantilla de correo
    slotOpenedSmsTemplateId:
      label: Plantilla de texto personalizada
      tooltip: Opcional. Si selecciona una plantilla, el texto de horario libre la usa en lugar del mensaje integrado.
    slotOpenedSms:
      label: Texto cuando se abre un horario
      description: Se envía cuando queda libre un horario que coincide y esta solicitud es la siguiente. El texto incluye el negocio, el servicio, la hora y un enlace para reservar.
    leaveWaitlistSmsTemplateId:
      label: Plantilla de texto personalizada
      tooltip: Opcional. Si selecciona una plantilla, la confirmación de salida la usa en lugar del mensaje integrado.
    leaveWaitlistSms:
      label: Texto cuando salen
      description: Se envía cuando el cliente abandona esta solicitud desde el enlace o respondiendo con la palabra clave de salida.
      required: Actívalo cuando los textos de horario libre están activos, para que el cliente reciba una confirmación.
    bookingPageId:
      label: Página de reserva
      tooltip: Página utilizada para URL de libro desde enlace.
      required: Seleccione una página de reserva
    cooldownMinutes:
      label: Enfriamiento entre ofertas
      tooltip: Tiempo mínimo antes de que a la misma solicitud de lista de espera se le pueda ofrecer otro espacio abierto.
      required: Elija un tiempo de reutilización entre 15 minutos y 30 días
    exclusiveAccessMinutes:
      label: Ventana de acceso exclusivo
      tooltip: Cuánto tiempo tiene la persona actual para reservar antes de que a la siguiente persona de la lista se le ofrezca el mismo espacio. Zero ofrece a la siguiente persona inmediatamente.
      required: Elija de 0 a 60 minutos
    smsRemoveKeyword:
      label: SMS dejar palabra clave
      tooltip: Los clientes responden con esta palabra (en cualquier caso) para abandonar esa solicitud de lista de espera. Requerido cuando se configura SMS con ranura abierta.
      placeholder: ELIMINAR
      required: Ingrese una palabra clave que los clientes puedan enviar por mensaje de texto para irse
    slotOpenedChannel:
      required: Active el correo, el mensaje de texto o ambos.
handlers:
  newWaitlistEntry: "Notificación de lista de espera de clientes: nueva entrada"
  slotOpened: "Notificación de lista de espera de clientes: espacio abierto"
  leaveWaitlist: "Notificación de lista de espera del cliente: lista de espera izquierda"
statusText:
  successfully_set_up: Configure correctamente las notificaciones de la lista de espera de clientes
  error_sending_email_notification_for_new_waitlist_entry: Error al enviar una notificación por correo electrónico para una nueva entrada en la lista de espera
  email_app_not_configured: La aplicación predeterminada del remitente de correo electrónico no está configurada
  error_processing_configuration: Configuración de procesamiento de errores
