app:
  displayName: Сповіщення клієнтів про список очікування
  description: Надсилайте клієнтам email, коли вони приєднуються до списку очікування, і сповіщайте, коли з’являється відповідний час, щоб вони могли записатися або вийти.
navigation:
  title: Черга клієнтів
setup:
  update: Оновити <app></app>
  add: Додати <app></app>
  form:
    customerNewEntryEmail:
      label: Надсилати email під час запису в список очікування
      description: Надсилається, коли клієнт приєднується до списку очікування.
    customerNewEntryTemplateId:
      label: Шаблон email
      tooltip: Email, який клієнти отримують, коли приєднуються до списку очікування.
      placeholder: ID шаблону
      required: Оберіть шаблон email
    notifyOnSlotOpened:
      label: Сповіщати, коли з’являється бажаний час
      tooltip: Пропонуйте найстаріший відповідний запит, коли звільняється час. Увімкніть email, текстове повідомлення або обидва.
    slotOpenedEmail:
      label: Надсилати email, коли з’являється час
      description: Надсилається, коли звільняється відповідний час і ця заявка наступна.
    slotOpenedEmailTemplateId:
      label: Шаблон email
      tooltip: Email, який клієнти отримують, коли з’являється відповідний час.
      required: Оберіть шаблон email
    slotOpenedSmsTemplateId:
      label: Власний шаблон повідомлення
      tooltip: "Необов'язково. Якщо шаблон вибрано, повідомлення про вільний час використовує його замість стандартного тексту."
    slotOpenedSms:
      label: Текст, коли з’являється час
      description: Надсилається, коли звільняється відповідний час і ця заявка наступна. Текст містить назву бізнесу, послугу, час і посилання для запису.
    leaveWaitlistSmsTemplateId:
      label: Власний шаблон повідомлення
      tooltip: "Необов'язково. Якщо шаблон вибрано, підтвердження виходу використовує його замість стандартного тексту."
    leaveWaitlistSms:
      label: Текст, коли клієнт виходить
      description: Надсилається після виходу з цієї заявки за посиланням або відповіддю з ключовим словом.
      required: Увімкніть, якщо тексти про вільний час увімкнено, щоб клієнт отримав підтвердження.
    bookingPageId:
      label: Сторінка бронювання
      tooltip: Сторінка для посилань «забронювати».
      required: Оберіть сторінку бронювання
    cooldownMinutes:
      label: Пауза між пропозиціями
      tooltip: Мінімальний час, перш ніж той самий запит можна знову запропонувати на інший вільний слот.
      required: Оберіть паузу від 15 хвилин до 30 днів
    exclusiveAccessMinutes:
      label: Вікно ексклюзивного доступу
      tooltip: Скільки часу поточна людина має, щоб записатися, перш ніж пропозиція перейде до наступної в черзі. Нуль пропонує наступній одразу.
      required: Оберіть від 0 до 60 хвилин
    smsRemoveKeyword:
      label: Ключове слово SMS для виходу
      tooltip: Клієнти відповідають цим словом (без урахування регістру), щоб вийти з цього запиту. Обов’язкове, якщо налаштовано SMS про вільний слот.
      placeholder: REMOVE
      required: Вкажіть ключове слово для виходу
    slotOpenedChannel:
      required: Увімкніть email, текстове повідомлення або обидва.
handlers:
  newWaitlistEntry: Сповіщення клієнта про чергу - Новий запис
  slotOpened: Сповіщення клієнта про чергу - Звільнився слот
  leaveWaitlist: Сповіщення клієнта про чергу - Вихід зі списку
statusText:
  successfully_set_up: Успішно налаштовано сповіщення клієнтів про список очікування
  error_sending_email_notification_for_new_waitlist_entry: Помилка надсилання email сповіщення про новий запис черги
  email_app_not_configured: Додаток відправника email за замовчуванням не налаштований
  error_processing_configuration: Помилка обробки конфігурації
