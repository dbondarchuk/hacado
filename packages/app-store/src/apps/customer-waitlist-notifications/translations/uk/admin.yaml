app:
  displayName: Сповіщення клієнтів про список очікування
  description: Надсилайте клієнтам email, коли вони приєднуються до списку очікування, і сповіщайте, коли з’являється відповідний час, щоб вони могли записатися або вийти.
navigation:
  title: Черга клієнтів
setup:
  update: Оновити <app></app>
  add: Додати <app></app>
  form:
    customerNewEntryTemplateId:
      label: Шаблон email клієнту про новий запис
      tooltip: Необов'язковий шаблон email, який клієнти отримають, коли приєднаються до списку очікування. Залиште порожнім, щоб не надсилати.
      placeholder: ID шаблону
    notifyOnSlotOpened:
      label: Сповіщати, коли з’являється бажаний слот
      tooltip: Надсилайте email та/або SMS клієнтам у списку очікування, коли звільняється відповідний час. Найстаріший запит пропонується першим.
    slotOpenedEmailTemplateId:
      label: Шаблон email про вільний слот
      tooltip: Email, який надсилається, коли з’являється відповідний час. Якщо сповіщення про слот увімкнено, потрібен email, SMS або обидва.
    slotOpenedSmsTemplateId:
      label: Шаблон SMS про вільний слот
      tooltip: SMS, який надсилається, коли з’являється відповідний час. Додайте посилання на бронювання та вихід. Відповідь ключовим словом скасовує цей запит.
    leaveWaitlistSmsTemplateId:
      label: Шаблон SMS-підтвердження виходу
      tooltip: Надсилається після виходу за посиланням або ключовим словом SMS. Обов’язковий, якщо налаштовано SMS про вільний слот.
    bookingPageId:
      label: Сторінка бронювання
      tooltip: Сторінка для посилань «забронювати». Зберігається за ID, тож зміна slug не ламає посилання.
      required: Оберіть сторінку бронювання
    cooldownMinutes:
      label: Пауза між пропозиціями
      tooltip: Мінімальний час, перш ніж той самий запит можна знову запропонувати на інший вільний слот.
      required: Оберіть паузу від 15 хвилин до 30 днів
    exclusiveAccessMinutes:
      label: Вікно ексклюзивного доступу
      tooltip: Скільки часу поточна людина має, щоб записатися, перш ніж пропозиція перейде до наступної в черзі. Нуль пропонує наступній одразу.
      required: Оберіть від 0 до 60 хвилин
    smsRemoveKeyword:
      label: Ключове слово SMS для виходу
      tooltip: Клієнти відповідають цим словом (без урахування регістру), щоб вийти з цього запиту. Обов’язкове, якщо налаштовано SMS про вільний слот.
      placeholder: REMOVE
      required: Вкажіть ключове слово для виходу
    slotOpenedChannel:
      required: Оберіть шаблон email, SMS або обидва
handlers:
  newWaitlistEntry: Сповіщення клієнта про чергу - Новий запис
  slotOpened: Сповіщення клієнта про чергу - Звільнився слот
  leaveWaitlist: Сповіщення клієнта про чергу - Вихід зі списку
statusText:
  successfully_set_up: Успішно налаштовано сповіщення клієнтів про список очікування
  error_sending_email_notification_for_new_waitlist_entry: Помилка надсилання email сповіщення про новий запис черги
  email_app_not_configured: Додаток відправника email за замовчуванням не налаштований
  error_processing_configuration: Помилка обробки конфігурації
