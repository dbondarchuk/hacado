title: Bande
app:
  displayName: Bande
  description: |-
    **Stripe** permet aux entreprises d'accepter les **cartes**, les **portefeuilles** et d'autres méthodes de paiement en ligne.

    **Hacado** se connecte à votre compte **Stripe** via **Stripe Connect** afin que les clients puissent **payer lorsqu'ils réservent**.
form:
  connect: Connectez <app></app>
  reconnect: Reconnecter <app></app>
  pendingAuthorization: En attente de l’autorisation Stripe…
  inStoreSync:
    label: Synchronisez les paiements par carte en personne
    description: Importez automatiquement les paiements par carte Stripe en personne via le webhook charge.succeeded, puis associez-les aux rendez-vous.
    save: Enregistrer les paramètres de synchronisation
    saveSuccess: Paramètres de synchronisation en magasin Stripe enregistrés
    saveError: Erreur lors de l'enregistrement des paramètres de synchronisation en magasin Stripe
  matchWindow:
    label: Fenêtre de match (minutes)
    description: Dans quelle mesure l'heure de fin d'un rendez-vous peut-elle être éloignée de l'heure de paiement pour être considérée comme une correspondance.
statusText:
  sync_settings_saved: Paramètres de synchronisation en magasin Stripe enregistrés
  redirect_missing_app_id: La réponse d'autorisation ne contient pas l'identifiant de l'application
  redirect_missing_code: La réponse d'autorisation ne contient pas le code d'autorisation
  access_denied: L'accès à Stripe a été refusé
  oauth_error: Stripe a renvoyé une erreur OAuth
  not_authorized: Stripe n'a pas renvoyé les jetons requis
  missing_oauth_config: Stripe Connect OAuth n'est pas configuré sur le serveur
  token_refresh_failed: Impossible d'actualiser le jeton d'accès Stripe
  app_not_configured: Stripe n'est pas connecté
  payment_failed: Stripe n'a pas pu traiter le paiement
  payment_incomplete: Le paiement Stripe n'a pas été effectué
  webhook_not_configured: Les webhooks Stripe ne sont pas configurés sur le serveur
  invalid_webhook_signature: Signature de webhook Stripe invalide
  apple_pay_domain_registration_failed: Impossible d'enregistrer le domaine Apple Pay avec Stripe
  cannot_uninstall_has_payments: Impossible de supprimer Stripe car les paiements créés avec cette application existent
validation:
  accountId:
    required: L'identifiant du compte Stripe est requis
  paymentIntentId:
    required: L'identifiant de l'intention de paiement est requis

