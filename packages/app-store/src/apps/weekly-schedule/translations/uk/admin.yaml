title: Тижневий розклад
app:
  displayName: Тижневий розклад
  description: Додає винятки для компанії (свята) та співробітників поверх типового розкладу. Позначте свята, щоб закрити всіх; інакше співробітник може перевизначити відкриті години компанії.
navigation:
  main:
    title: Тижневий розклад
    description: Керувати вашим тижневим розкладом
form:
  thisWeek: Цей тиждень
  previousWeek: Попередній тиждень
  nextWeek: Наступний тиждень
  setCustomWeeklySchedule: Встановити власний тижневий розклад
  selectMember: Виберіть співробітника
  companySchedule: Компанія (усі співробітники)
  legend: "Години з шару:"
  source:
    default: Типовий
    company: Компанія
    member: Співробітник
    app: Додаток
    holiday: Свято
  recurrence:
    badge: "Повторюється кожні {everyWeeks} тижні до {until}"
    weekOverride: Цей тиждень має разове перевизначення поверх серії
  holidays:
    title: Свята компанії
    description: Жорстке закриття для всіх. Очищення годин нижче - не свято; співробітники можуть все одно задати свої зміни.
    closeWeek: Закрити весь тиждень
    clear: Очистити свята
dialogs:
  reset:
    title: Ви абсолютно впевнені?
    description: Цю дію неможливо скасувати. Це скине розклад для тижня {week} до стандартного.
    descriptionCompany: Цю дію неможливо скасувати. Це скине розклад для тижня {week} до розкладу компанії.
    descriptionFromSeries: Цю дію неможливо скасувати. Це прибере тиждень {week} з повторюваного розкладу (кожні {everyWeeks} тижні). Години повернуться до стандартного розкладу. Інші тижні серії залишаться.
    descriptionFromSeriesCompany: Цю дію неможливо скасувати. Це прибере тиждень {week} з повторюваного розкладу (кожні {everyWeeks} тижні). Години повернуться до розкладу компанії. Інші тижні серії залишаться.
    descriptionOverrideOnSeries: Цю дію неможливо скасувати. Це очистить разове перевизначення для тижня {week} і прибере його з повторюваного розкладу. Години повернуться до стандартного розкладу.
    descriptionOverrideOnSeriesCompany: Цю дію неможливо скасувати. Це очистить разове перевизначення для тижня {week} і прибере його з повторюваного розкладу. Години повернуться до розкладу компанії.
    success: Тижневий розклад для тижня {week} успішно скинуто до стандартного
    successCompany: Тижневий розклад для тижня {week} успішно скинуто до розкладу компанії
    successFromSeries: Тиждень {week} прибрано з повторюваного розкладу
    cancel: Скасувати
    reset: Скинути
    resetThisWeekToDefault: Скинути цей тиждень до стандартного
    resetThisWeekToCompany: Скинути цей тиждень до компанії
    removeThisWeekFromSeries: Прибрати цей тиждень із серії
    resetToDefault: Скинути до стандартного
    resetToCompany: Скинути до компанії
    defaultSchedule: Стандартний розклад
    companySchedule: Розклад компанії
    removeSeries: Видалити повторюваний розклад
    removeSeriesDescription: Це видалить повторюваний розклад (кожні {everyWeeks} тижні до {until}). Усі тижні цієї серії повернуться до розкладу ({fallback}). Разові перевизначення тижнів залишаться.
    removeSeriesSuccess: Повторюваний розклад видалено
    fallbackDefault: стандартного
    fallbackCompany: компанії
  resetAll:
    title: Ви абсолютно впевнені?
    description: Цю дію неможливо скасувати. Це скине всі розклади з тижня {week} до стандартного, включно з повторюваними серіями, що починаються з цього тижня (раніші серії обрізаються).
    descriptionCompany: Цю дію неможливо скасувати. Це скине всі розклади з тижня {week} до розкладу компанії, включно з повторюваними серіями, що починаються з цього тижня (раніші серії обрізаються).
    success: Всі розклади з тижня {week} успішно скинуто до стандартного
    successCompany: Всі розклади з тижня {week} успішно скинуто до розкладу компанії
    cancel: Скасувати
    reset: Скинути
    resetAllToDefault: Скинути все з цього тижня до стандартного
    resetAllToCompany: Скинути все з цього тижня до компанії
  copy:
    title: Копіювати розклад
    description: Скопіювати години цього тижня на інший тиждень як разовий розклад (не повторювану серію).
    success: Розклад успішно скопійовано
    cancel: Скасувати
    copy: Копіювати
    copySchedule: Копіювати розклад
  repeat:
    title: Повторити розклад
    description: Створити новий повторюваний розклад з годин цього тижня. Існуюча серія не змінюється.
    success: Створено новий повторюваний розклад з тижня {week} кожні {interval} тижні до {maxWeek}
    cancel: Скасувати
    copy: Створити
    repeatSchedule: Повторити розклад
    repeatEvery: Повторювати кожні
    repeatUntil: Повторювати до
    repeatUntilTooltip: Найпізніший тиждень (включно), до якого повторювати розклад
    weeks: тижні
    replaceExisting: Замінити існуючі разові розклади
    replaceExistingDescription: Якщо відмічено, разові розклади для тижнів нової серії очищаються, щоб застосувався новий повторюваний шаблон
    close: Закрити
    confirmTitle: Ви абсолютно впевнені?
    confirmDescription: Це створить новий повторюваний розклад з тижня {week} кожні {interval} тижні до тижня {maxWeek}. Існуючі серії не змінюються; новіша серія має пріоритет там, де вони перекриваються.
statusText:
  successfully_installed: Додаток успішно встановлено
  error_processing_request: Помилка обробки запиту тижневого розкладу
  failed_to_load_schedule: Не вдалося завантажити розклад
  saved: Збережено!
  request_error: Виникла проблема з вашим запитом.
