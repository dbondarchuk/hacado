title: Horaire hebdomadaire
app:
  displayName: Horaire hebdomadaire
  description: |-
    Définissez les jours fériés de l'entreprise et les exceptions hebdomadaires par membre en plus de vos horaires par défaut.
    Marquez les jours fériés pour fermer tout le monde ; sinon, les membres peuvent modifier les heures d'ouverture de l'entreprise.
