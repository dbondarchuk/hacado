      **Cliente:** {customerLink}

      **Cantidad:** {amount}
      {tipLine}

      **Pagado en:** {paidAt}

      **Cita:** {appointmentLink}
    tipLine: "**Consejo:** {tip}"
    viewPayment: Ver pago

