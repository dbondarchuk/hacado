app:
  displayName: Посилання на оплату
  description: |-
    **Посилання на оплату** дозволяють приймати оплату в будь-який момент — не лише під час бронювання.

    Створіть хостовану сторінку оплати для запису, балансу клієнта, подарункової картки чи довільної суми й надішліть її **електронною поштою**, **SMS** або **скопіювавши посилання**. Клієнт відкриває посилання й оплачує онлайн через ваш підключений платіжний сервіс.

    Можливості:
    - Надсилати запити на оплату з записів, клієнтів або подарункових карток за кілька кліків.
    - За потреби вимагати **підтвердження особи** (збіг контакту або OTP) перед оплатою.
    - Пропонувати **чайові**, задавати **термін дії посилання** та оформлювати сторінку власним заголовком і підвалом.
    - Відстежувати очікувані й оплачені посилання разом з іншими платежами.
statusText:
  successfully_set_up: Посилання на оплату успішно налаштовано
  error_processing_configuration: Помилка обробки налаштувань посилань на оплату
form:
  connect: Підключити <app></app>
  update: Оновити <app></app>
  paymentAppRequired:
    Спочатку налаштуйте платіжний застосунок за замовчуванням у розділі
    Додатки → Додатки за замовчуванням, перш ніж підключати Посилання на
    оплату.
  paymentAppRequiredLink: Відкрити додатки за замовчуванням
  verification:
    label: Перевірка
    description: Як клієнт підтверджує особу перед оплатою
    values:
      none: Без перевірки
      contact-match: Збіг email або телефону
      otp: Одноразовий код (OTP)
  emailTemplateId:
    label: Шаблон email
    description: Шаблон для надсилання посилання на оплату електронною поштою
  smsTemplateId:
    label: Шаблон SMS
    description: Шаблон для надсилання посилання на оплату SMS
  linkExpiryDays:
    label: Термін дії (дні)
    description: Необовʼязково. Посилання закінчується через вказану кількість днів.
    placeholder: "7"
  tipsEnabled:
    label: Чайові
    description: Дозволити клієнту додати чайові на публічній сторінці оплати
  tipPresets:
    label: Пресети чайових
    description: До 4 варіантів у відсотках (окрім «Без чайових» і «Своя сума»)
    add: Додати пресет
    percentage: "% від суми"
    remove: Видалити
  headerId:
    label: Заголовок сторінки
    description: Необовʼязковий заголовок публічної сторінки оплати
    placeholder: Оберіть заголовок
  footerId:
    label: Підвал сторінки
    description: Необовʼязковий підвал публічної сторінки оплати
    placeholder: Оберіть підвал
  notifyOnPaid:
    label: Надсилати email персоналу після оплати
    description:
      Надсилати email автору посилання та спеціалісту, призначеному на
      запис, коли клієнт оплачує
  notifyCoordinatorsOnPaid:
    label: Надсилати email координаторам і вище
    description:
      Також надсилати email координаторам, адміністраторам і власнику,
      коли посилання на оплату оплачено
handlers:
