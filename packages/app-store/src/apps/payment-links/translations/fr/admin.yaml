app:
  displayName: Liens de paiement
  description: |-
    **Liens de paiement** vous permet d'encaisser le paiement à tout moment, sans attendre le paiement lors de la réservation.

    Créez une page de paiement hébergée pour un rendez-vous, un solde client, une carte cadeau ou un montant personnalisé, puis partagez-la par **e-mail**, **SMS** ou **en copiant le lien**. Les clients ouvrent le lien et paient en ligne via votre fournisseur de paiement connecté.

    Utilisez-le pour :
    - Envoyez des demandes de paiement depuis des rendez-vous, des clients ou des cartes cadeaux en quelques clics.
    - Exigez éventuellement une **vérification d'identité** (correspondance de contact ou OTP) avant de payer.
    - Offrez des **conseils**, définissez l'**expiration du lien** et marquez la page avec votre en-tête et votre pied de page.
    - Suivez les liens en attente et payés aux côtés de vos autres paiements.
