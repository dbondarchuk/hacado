app:
  displayName: URL Schedule Provider
  description: Connect to an external URL to fetch schedule data for calendar integration.
form:
  url:
    label: URL
    placeholder: "https://example.com/schedule/'{{memberId}}'?start='{{start}}'&end='{{end}}'"
    description: "Use placeholders that are replaced when the URL is called: <code>'{{memberId}}'</code>, <code>'{{email}}'</code>, <code>'{{start}}'</code>, and <code>'{{end}}'</code> (ISO datetimes).<br></br>Example: <code>https://example.com/schedule/'{{memberId}}'?start='{{start}}'&end='{{end}}'</code>."
    tooltip: The URL endpoint that provides schedule data. Nothing is appended automatically - include placeholders where needed.
  headers:
    label: Headers
    addButton: Add Header
    keyLabel: Header Name
    keyPlaceholder: Authorization
    valueLabel: Header Value
    valuePlaceholder: Bearer token
    removeButton: Remove
    description: "Header names and values support the same placeholders: <code>'{{memberId}}'</code>, <code>'{{email}}'</code>, <code>'{{start}}'</code>, and <code>'{{end}}'</code>."
    tooltip: Optional HTTP headers. Placeholders are replaced per request when calling.
  connect: Connect with <app></app>
validation:
  form:
    url:
      required: URL is required
      url: Please enter a valid URL
      max: URL must be at most 2048 characters long
    headers:
      key:
        required: Header name is required
        unique: Header name must be unique
        max: Header name must be at most 256 characters long
      value:
        required: Header value is required
        max: Header value must be at most 4096 characters long
statusText:
  successfully_connected: Successfully connected to URL schedule provider
  error_processing_configuration: Error processing configuration
  error_fetching_schedule: Error fetching schedule from URL
  invalid_response_format: Invalid response format from URL
