title: Outlook
app:
  displayName: Outlook
  description: Microsoft Office 365 es un conjunto de aplicaciones que le ayudan a mantenerse conectado con otras personas y realizar sus tareas. Incluye, entre otros, Microsoft Word, PowerPoint, Excel, Teams, OneNote y OneDrive. Office 365 le permite trabajar de forma remota con otras personas de un equipo y colaborar en un entorno en línea. Están disponibles tanto versiones web como aplicaciones de escritorio/móviles.
