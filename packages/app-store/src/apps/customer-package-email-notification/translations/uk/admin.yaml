app:
  displayName: Email-сповіщення про пакети клієнта
  description: Надсилайте клієнтам листи про купівлю пакета та коли пакет вичерпано, скасовано, прострочено або скоро закінчиться
navigation:
  title: Email пакети клієнта
form:
  purchased:
    enabled:
      label: Надсилати email, коли пакет придбано
      description: Надсилається, коли клієнту видано пакет.
    templateId:
      label: Шаблон email
      description: Email, який клієнти отримують, коли їм видано пакет.
      required: Оберіть шаблон email
  exhausted:
    enabled:
      label: Надсилати email, коли пакет вичерпано
      description: Надсилається, коли всі кредити пакета використано.
    templateId:
      label: Шаблон email
      description: Email, який клієнти отримують, коли всі кредити пакета використано.
      required: Оберіть шаблон email
  cancelled:
    enabled:
      label: Надсилати email, коли пакет скасовано
      description: Надсилається, коли активний пакет скасовано.
    templateId:
      label: Шаблон email
      description: Email, який клієнти отримують, коли активний пакет скасовано.
      required: Оберіть шаблон email
  expired:
    enabled:
      label: Надсилати email, коли термін пакета закінчується
      description: Надсилається, коли настав термін дії пакета.
    templateId:
      label: Шаблон email
      description: Email, який клієнти отримують, коли настав термін дії пакета.
      required: Оберіть шаблон email
  expiringSoon:
    enabled:
      label: Надсилати email, коли термін пакета скоро закінчиться
      description: Надсилається до закінчення терміну дії пакета.
    thresholdMinutes:
      label: Сповістити до закінчення
      description: За який час до закінчення терміну надіслати нагадування.
    templateId:
      label: Шаблон email
      description: Email, який клієнти отримують до закінчення терміну дії пакета.
      required: Оберіть шаблон email
statusText:
  successfully_set_up: Успішно налаштовано
