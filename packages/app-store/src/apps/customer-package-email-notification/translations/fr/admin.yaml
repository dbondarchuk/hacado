app:
  displayName: Notification par e-mail du colis client
  description: Envoyez un e-mail aux clients lorsqu'ils achètent un forfait et lorsque leur forfait est épuisé, annulé, expiré ou sur le point d'expirer
navigation:
  title: E-mails de colis client
form:
  purchased:
    enabled:
      label: "Envoyer un e-mail lorsqu'un forfait est acheté"
      description: "Envoyé lorsqu'un forfait est émis à un client."
    templateId:
      label: "Modèle d'e-mail"
      description: "E-mail que les clients reçoivent lorsqu'un forfait est émis."
      required: "Sélectionnez un modèle d'e-mail"
  exhausted:
    enabled:
      label: "Envoyer un e-mail lorsqu'un forfait est épuisé"
      description: "Envoyé lorsque tous les crédits du forfait sont utilisés."
    templateId:
      label: "Modèle d'e-mail"
      description: "E-mail que les clients reçoivent lorsque tous les crédits du forfait sont utilisés."
      required: "Sélectionnez un modèle d'e-mail"
  cancelled:
    enabled:
      label: "Envoyer un e-mail lorsqu'un forfait est annulé"
      description: "Envoyé lorsqu'un forfait actif est annulé."
    templateId:
      label: "Modèle d'e-mail"
      description: "E-mail que les clients reçoivent lorsqu'un forfait actif est annulé."
      required: "Sélectionnez un modèle d'e-mail"
  expired:
    enabled:
      label: "Envoyer un e-mail lorsqu'un forfait expire"
      description: "Envoyé lorsqu'un forfait atteint sa date d'expiration."
    templateId:
      label: "Modèle d'e-mail"
      description: "E-mail que les clients reçoivent lorsqu'un forfait atteint sa date d'expiration."
      required: "Sélectionnez un modèle d'e-mail"
  expiringSoon:
    enabled:
      label: "Envoyer un e-mail lorsqu'un forfait est sur le point d'expirer"
      description: "Envoyé avant l'expiration d'un forfait."
    thresholdMinutes:
      label: Notifier avant expiration
      description: "Combien de temps avant l'expiration du forfait envoyer le rappel."
    templateId:
      label: "Modèle d'e-mail"
      description: "E-mail que les clients reçoivent avant l'expiration d'un forfait."
      required: "Sélectionnez un modèle d'e-mail"
statusText:
  successfully_set_up: Configuration réussie
  error_processing_configuration: Configuration du traitement des erreurs
  error_sending_package_email: Erreur lors de l'envoi de l'e-mail du colis client
handlers:
  purchased: E-mail du colis client - Acheté
  exhausted: E-mail du colis client - Épuisé
  cancelled: E-mail du colis client - Annulé
  expired: E-mail du package client - Expiré
  expiringSoon: E-mail du package client - Expire bientôt
validation:
  emailTemplate:
    templateId:
      required: "Sélectionnez un modèle d'e-mail"
      min: "Sélectionnez un modèle d'e-mail"
  expiringSoon:
    thresholdMinutes:
      min: Choisissez combien de temps avant l'expiration envoyer le rappel

