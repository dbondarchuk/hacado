app:
  displayName: Notificación por correo electrónico del paquete del cliente
  description: Envíe correos electrónicos a los clientes cuando compren un paquete y cuando su paquete esté agotado, cancelado, vencido o a punto de caducar.
navigation:
  title: Correos electrónicos de paquetes de clientes
form:
  purchased:
    enabled:
      label: Enviar correo cuando se compra un paquete
      description: Se envía cuando se emite un paquete a un cliente.
    templateId:
      label: Plantilla de correo
      description: Correo que reciben los clientes cuando se les emite un paquete.
      required: Seleccione una plantilla de correo
  exhausted:
    enabled:
      label: Enviar correo cuando se agota un paquete
      description: Se envía cuando se usan todos los créditos del paquete.
    templateId:
      label: Plantilla de correo
      description: Correo que reciben los clientes cuando se usan todos los créditos del paquete.
      required: Seleccione una plantilla de correo
  cancelled:
    enabled:
      label: Enviar correo cuando se cancela un paquete
      description: Se envía cuando se cancela un paquete activo.
    templateId:
      label: Plantilla de correo
      description: Correo que reciben los clientes cuando se cancela un paquete activo.
      required: Seleccione una plantilla de correo
  expired:
    enabled:
      label: Enviar correo cuando vence un paquete
      description: Se envía cuando un paquete llega a su fecha de vencimiento.
    templateId:
      label: Plantilla de correo
      description: Correo que reciben los clientes cuando un paquete llega a su fecha de vencimiento.
      required: Seleccione una plantilla de correo
  expiringSoon:
    enabled:
      label: Enviar correo cuando un paquete está por vencer
      description: Se envía antes de que venza un paquete.
    thresholdMinutes:
      label: Notificar antes del vencimiento
      description: Cuánto tiempo antes de que venza el paquete se envía el recordatorio.
    templateId:
      label: Plantilla de correo
      description: Correo que reciben los clientes antes de que venza un paquete.
      required: Seleccione una plantilla de correo
statusText:
  successfully_set_up: Configurado exitosamente
