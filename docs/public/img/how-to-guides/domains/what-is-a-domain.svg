<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320" role="img" aria-labelledby="title desc">
  <title id="title">What a domain name is</title>
  <desc id="desc">A domain is like a street address for your website. People type the easy name; the internet looks up where to send them.</desc>
  <rect width="880" height="320" fill="#f8fafc" rx="16"/>
  <rect x="40" y="40" width="360" height="240" rx="12" fill="#fff" stroke="#e2e8f0"/>
  <text x="220" y="78" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#0f172a">Like a street address</text>
  <text x="70" y="120" font-family="system-ui,sans-serif" font-size="14" fill="#334155">Your shop has an address so people</text>
  <text x="70" y="142" font-family="system-ui,sans-serif" font-size="14" fill="#334155">can find the building.</text>
  <rect x="70" y="168" width="300" height="72" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="220" y="200" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#991b1b">123 Main Street</text>
  <text x="220" y="222" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#7f1d1d">City, State</text>
  <rect x="480" y="40" width="360" height="240" rx="12" fill="#fff" stroke="#e2e8f0"/>
  <text x="660" y="78" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#0f172a">A domain is a web address</text>
  <text x="510" y="120" font-family="system-ui,sans-serif" font-size="14" fill="#334155">Your website has a name so people</text>
  <text x="510" y="142" font-family="system-ui,sans-serif" font-size="14" fill="#334155">can find it in a browser.</text>
  <rect x="510" y="168" width="300" height="72" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="660" y="200" text-anchor="middle" font-family="ui-monospace,monospace" font-size="15" font-weight="600" fill="#1e40af">www.yourbusiness.com</text>
  <text x="660" y="222" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#1e3a8a">Easy name -&gt; your site</text>
  <path d="M410 160 H470" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
