<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" role="img" aria-labelledby="title desc">
  <title id="title">Example DNS records for Hacado</title>
  <desc id="desc">Example A, CNAME, and ALIAS records. Always copy the exact values shown in your Hacado Connect dialog.</desc>
  <rect width="880" height="340" fill="#f8fafc" rx="16"/>
  <text x="40" y="42" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#0f172a">Example DNS panel (labels vary by seller)</text>
  <text x="40" y="66" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">Use the IP and hostname from your Hacado dialog &#8212; do not invent values.</text>
  <rect x="40" y="88" width="800" height="44" rx="8" fill="#0f172a"/>
  <text x="60" y="116" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#fff">Type</text>
  <text x="180" y="116" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#fff">Name / Host</text>
  <text x="400" y="116" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#fff">Value / Points to</text>
  <text x="720" y="116" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#fff">When</text>
  <rect x="40" y="140" width="800" height="52" fill="#fff" stroke="#e2e8f0"/>
  <text x="60" y="172" font-family="ui-monospace,monospace" font-size="13" fill="#0f172a">A</text>
  <text x="180" y="172" font-family="ui-monospace,monospace" font-size="13" fill="#0f172a">@</text>
  <text x="400" y="172" font-family="ui-monospace,monospace" font-size="13" fill="#1d4ed8">15.x.x.x  (copy from Hacado)</text>
  <text x="720" y="172" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">Apex</text>
  <rect x="40" y="192" width="800" height="52" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="224" font-family="ui-monospace,monospace" font-size="13" fill="#0f172a">CNAME</text>
  <text x="180" y="224" font-family="ui-monospace,monospace" font-size="13" fill="#0f172a">www</text>
  <text x="400" y="224" font-family="ui-monospace,monospace" font-size="13" fill="#1d4ed8">yourname.hacado.me</text>
  <text x="720" y="224" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">Subdomain</text>
  <rect x="40" y="244" width="800" height="52" fill="#fff" stroke="#e2e8f0"/>
  <text x="60" y="276" font-family="ui-monospace,monospace" font-size="13" fill="#0f172a">ALIAS</text>
  <text x="180" y="276" font-family="ui-monospace,monospace" font-size="13" fill="#0f172a">@</text>
  <text x="400" y="276" font-family="ui-monospace,monospace" font-size="13" fill="#1d4ed8">yourname.hacado.me</text>
  <text x="720" y="276" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">If supported</text>
  <text x="40" y="322" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">Pick one clear answer per hostname. Do not leave an old A and a new CNAME fighting for the same name.</text>
</svg>
