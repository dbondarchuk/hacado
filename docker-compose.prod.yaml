      - SMS_UNVERIFIED_PROVIDER=${SMS_UNVERIFIED_PROVIDER:-textbelt}
      - SMS_SUPPORTED_COUNTRIES=${SMS_SUPPORTED_COUNTRIES:-US,CA}
      - SMS_RATE_LIMIT_PER_MINUTE=${SMS_RATE_LIMIT_PER_MINUTE:-60}
